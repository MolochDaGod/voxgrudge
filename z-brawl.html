// ============================================================================
//  Collisions (actors + buildings, zombies chew structures)
// ============================================================================
function actorBodyRadius(a){
    if(a===player && playerVehicle) return vehicleColliderRadius(playerVehicle);
    return COLLISION_RADIUS;
}
function cullDistantEnemies(){
    for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i];
        if(e.userData.isBoss) continue;
        if(distSqTo(e)>ENEMY_DESPAWN_RADIUS*ENEMY_DESPAWN_RADIUS){
            scene.remove(e); enemies.splice(i,1);
        }
    }
}
function resolveCollisions(){
    const pr=actorBodyRadius(player);
    const simR2=ENEMY_SIM_RADIUS*ENEMY_SIM_RADIUS;
    // player ↔ nearby hostiles (skip O(n²) zombie-zombie)
    for(const e of enemies){
        if(distSqTo(e)>simR2) continue;
        const er=actorBodyRadius(e);
        const dx=player.position.x-e.position.x, dz=player.position.z-e.position.z;
        const d2=dx*dx+dz*dz, touch=(pr+er)*1.1;
        if(d2<touch*touch && d2>0.01){
            const d=Math.sqrt(d2), ov=(touch-d)*0.5, nx=dx/d, nz=dz/d;
            player.position.x+=nx*ov; player.position.z+=nz*ov;
            e.position.x-=nx*ov; e.position.z-=nz*ov;
        }
    }
    const actors=[player,...enemies,...allies];
    for(let i=0;i<actors.length;i++){ const a=actors[i];
        if(a!==player && distSqTo(a)>simR2) continue;
        const ar=actorBodyRadius(a);
        for(let j=0;j<obstacles.length;j++){ const o=obstacles[j];
            if(a===player && o===shelterHome) continue;
            if(a===player && playerVehicle && o===playerVehicle) continue;
            const dx=a.position.x-o.position.x, dz=a.position.z-o.position.z;
            const d2=dx*dx+dz*dz; const minD=ar*1.15+(o.userData.radius||0.5);
            if(d2<minD*minD && d2>0.01){ const d=Math.sqrt(d2), ov=minD-d;
                a.position.x+=(dx/d)*ov; a.position.z+=(dz/d)*ov;
                if(o.userData.isBuilding && a.userData && a.userData.type){
                    a.userData.bldCd=(a.userData.bldCd||0)-0.016;
                    if(a.userData.bldCd<=0){ a.userData.bldCd=0.7; damageBuilding(o,a.userData.damage*0.6);
                        spawnParticles(o.position.clone().setY(1),0x885533,2,0.1,0.08,6); }
                }
            }
        }
    }
}

// ============================================================================
//  DAY / NIGHT cycle + density-driven spawning
// ============================================================================
let spawnAccum=0;
function updateCycle(dt){
    phaseTime+=dt;
    const len=isNight?NIGHT_SECONDS:(dayNum===1?FIRST_DAY_SECONDS:DAY_SECONDS);
    cycleT=phaseTime/len;
    if(cycleT>=1){ // flip phase
        phaseTime=0; cycleT=0;
        if(isNight){ isNight=false; dayNum++; nightsSurvived++;
            // dawn rewards for surviving
            res.scrap+=8; ammo+=15; addKillFeed(`☀ DAY ${dayNum} — survived the night`);
            spawnCivilian(); spawnCivilian(); // survivors appear by day
        } else { isNight=true; addKillFeed('🌙 NIGHTFALL — they are coming');
            // boss every 3rd night
            if(nightsSurvived>0 && nightsSurvived%3===2 && !bossActive){
                bossActive=true; const boss=spawnEnemy('BOSS');
                if(boss){ bossEnemy=boss; const bw=document.getElementById('boss-wrap'); if(bw) bw.style.display='block';
                    updateBossBar(); screenShake=8; }
            }
        }
        applyFogForPhase();
        updateUI();
    }
    skyAccum+=dt;
    if(skyAccum>=SKY_TICK){
        skyAccum=0;
        const dayLight = isNight ? 0 : Math.sin(Math.min(cycleT,1)*Math.PI);
        ambLight.intensity = isNight ? 0.18 : 0.35+dayLight*0.4;
        hemiLight.intensity = isNight?0.15:0.5+dayLight*0.3;
        sunLight.intensity = isNight?0.12:0.4+dayLight*0.9;
        if(isNight) _skyTmp.copy(_skyNight).lerp(_skyDusk, Math.max(0,1-cycleT*4));
        else { _skyTmp.copy(_skyDusk).lerp(_skyDay, Math.min(1,cycleT*2)); if(cycleT>0.6) _skyTmp.lerp(_skyDusk,(cycleT-0.6)*2.0); }
        scene.background.copy(_skyTmp); scene.fog.color.copy(_skyTmp);
        sunLight.color.setHex(isNight?0x6677aa:0xfff0dd);
        if(bloomPass) bloomPass.strength = isNight?0.55:0.35;
    }

    // ---- density-driven spawning ----
    const targetDensity = isNight?DENSITY_NIGHT:DENSITY_DAY;
    // alive count we want = density per 100m * (active area / 100m^2 area), capped
    const areaFactor = Math.pow(ACTIVE_RADIUS/100,2)*Math.PI; // ~2.8
    let targetAlive = Math.round(targetDensity*areaFactor*0.5);
    const cap=isNight?ENEMY_CAP_NIGHT:ENEMY_CAP_DAY;
    targetAlive=Math.min(targetAlive,cap);
    // ramp slightly with days survived for difficulty
    targetAlive=Math.min(cap, Math.round(targetAlive*(1+nightsSurvived*0.08)));

    const inGrace=clock.elapsedTime<spawnGraceUntil;
    if(inGrace) targetAlive=Math.min(targetAlive, dayNum===1?4:8);

    spawnAccum+=dt;
    let interval = isNight?0.45:1.6;
    if(inGrace) interval=isNight?1.1:2.8;
    if(spawnAccum>=interval && enemies.filter(e=>!e.userData.isBoss).length<targetAlive && !(bossActive&&!isNight)){
        spawnAccum=0;
        const roll=Math.random(); let type='GRUNT';
        const d=dayNum;
        if(d>1&&roll<0.14) type='RUNNER';
        else if(d>1&&roll<0.26) type='TANK';
        else if(d>1&&roll<0.36) type='EXPLODER';
        else if(d>2&&roll<0.45) type='SPITTER';
        else if(d>2&&roll<0.52) type='INFECTOR';
        else if(isNight&&d>2&&roll<0.57) type='BRUTE';
        else if(isNight&&d>3&&roll<0.60) type='WENDIGO';
        spawnEnemy(type);
    }
    densityTextAccum+=dt;
    if(densityTextAccum>=0.35){
        densityTextAccum=0;
        const within=enemies.filter(e=>distSqTo(e)<10000).length;
        const grace=inGrace?' · grace':'';
        document.getElementById('density-text').innerText=`${within} hostiles within 100 m · target ${isNight?'40':'2'}/100 m${grace}`;
    }
}

// orient an entity so it faces a world point (+Z toward target), plus per-rig faceYaw fix

function playClip(ud,names){ if(!ud.actions) return; const a=pickAction(ud.actions,names);
    if(a&&a!==ud.curAction){ if(ud.curAction) ud.curAction.fadeOut(0.2); a.reset().fadeIn(0.2).play(); ud.curAction=a; } }
function tintModel(root,hex,amt){ const col=new THREE.Color(hex);
    root.traverse(c=>{ if(c.isMesh&&c.material){ const ms=Array.isArray(c.material)?c.material:[c.material];
        ms.forEach(m=>{
            if(m.map){ if('emissive' in m){ m.emissive.copy(col); m.emissiveIntensity=0.06*amt; } }
            else if(m.color){ m.color.lerp(col,amt*0.45); if('emissive' in m){ m.emissive.copy(col); m.emissiveIntensity=0.1; } }
        }); } }); }

function loadAnimatedModel(key,targetHeight,onReady,fallbackBuilder,matOpts){
    const finish=(entry)=>{
        const root=entry.scene.clone(true);
        prepareMeshMaterials(root, matOpts);
        const nativeH=nativeHeightForModel(key);
        const box=new THREE.Box3().setFromObject(root); const size=new THREE.Vector3(); box.getSize(size);
        const s=targetHeight/((nativeH||size.y)||1); root.scale.setScalar(s);
        const box2=new THREE.Box3().setFromObject(root); root.position.y-=box2.min.y;
        let mixer=null, actions={};
        if(entry.animations&&entry.animations.length){ mixer=new THREE.AnimationMixer(root);
            entry.animations.forEach(cl=>{ actions[cl.name.toLowerCase()]=mixer.clipAction(cl); }); }
        onReady(root,mixer,actions);
    };
    if(animCache[key]==='FAIL'){ onReady(fallbackBuilder(),null,{}); return; }
    if(animCache[key]&&animCache[key]!=='LOADING'){ finish(animCache[key]); return; }
    if(!glbLoader){ onReady(fallbackBuilder(),null,{}); return; }
    if(animCache[key]==='LOADING'){ const iv=setInterval(()=>{ if(animCache[key]&&animCache[key]!=='LOADING'){ clearInterval(iv);
        animCache[key]==='FAIL'?onReady(fallbackBuilder(),null,{}):finish(animCache[key]); } },120); return; }
    animCache[key]='LOADING';
    loadGLBWithFallback(brawlModelUrls(key), g=>{ animCache[key]={scene:g.scene,animations:g.animations}; finish(animCache[key]); },
        ()=>{ animCache[key]='FAIL'; onReady(fallbackBuilder(),null,{}); });
}
// attach an animated model to a gameplay group; hides procedural placeholder meshes when ready
function attachAnimator(entity,opt){
    const placeholders=entity.children.filter(c=>c.isMesh);
    entity.userData.faceYaw=opt.faceYaw!=null?opt.faceYaw:(opt.kenneyTex?CHAR_FACE_YAW:0);
    const matOpts={ kenneyTex:opt.kenneyTex, modelYaw:opt.modelYaw||0 };
    loadAnimatedModel(opt.glb,opt.height,(root,mixer,actions)=>{
        if(!modelHasVisibleMesh(root)) return;
        if(opt.tint&&!opt.kenneyTex) tintModel(root,opt.tint,opt.tintAmt||0.35);
        entity.add(root);
        if(xzFog) xzFog.patchSubtree(root);
        entity.userData.model=root; entity.userData.mixer=mixer; entity.userData.actions=actions;
        if(mixer){ playClip(entity.userData, opt.defaultClip||['walk','run','idle']); }
        placeholders.forEach(p=>{ p.visible=false; });
    }, ()=>new THREE.Group(), matOpts);
}

    { id:'gunbike', name:'GUN BIKE',glb:'models/vehicles/gunbike.glb', tex:'models/vehicles/GunBike-0-GunBike.png', foot:4.5, maxSpeed:0.70, accel:0.014, turn:0.045, grip:0.90, fb:0x556070 },

];
const VEHICLE_TEX_CACHE={};
function loadVoxelPaletteTexture(texPath, onReady, onFail){
    if(!texPath){ onFail(); return; }
    if(VEHICLE_TEX_CACHE[texPath]){ onReady(VEHICLE_TEX_CACHE[texPath]); return; }
    const loader=new THREE.TextureLoader();
    loader.load(brawlModelUrl(texPath), tex=>{
        tex.magFilter=THREE.NearestFilter;
        tex.minFilter=THREE.NearestFilter;
        tex.generateMipmaps=false;
        tex.encoding=THREE.sRGBEncoding;
        tex.needsUpdate=true;
        VEHICLE_TEX_CACHE[texPath]=tex;
        onReady(tex);
    }, undefined, onFail);
}
function applyVoxelPaletteMaterials(root, tex){
    root.traverse(c=>{
        if(!c.isMesh||!c.material) return;
        c.castShadow=true; c.receiveShadow=true;
        if(c.geometry&&!c.geometry.attributes.normal) c.geometry.computeVertexNormals();
        const ms=Array.isArray(c.material)?c.material:[c.material];
        const out=ms.map(m=>{
            const mat=m.clone();
            if(tex) mat.map=tex;
            if(mat.map){
                mat.map.magFilter=THREE.NearestFilter;
                mat.map.minFilter=THREE.NearestFilter;
                mat.map.generateMipmaps=false;
                mat.map.encoding=THREE.sRGBEncoding;
                mat.map.needsUpdate=true;
            }
            if(mat.color) mat.color.setHex(0xffffff);
            mat.metalness=0.05;
            mat.roughness=0.9;
            if(mat.emissive) mat.emissive.setHex(0x000000);
            mat.emissiveIntensity=0;
            mat.needsUpdate=true;
            return mat;
        });
        c.material=out.length===1?out[0]:out;
    });
}
function vehicleColliderRadius(v){ return (v.userData.def.foot||4)*0.52; }
function fallbackVehicle(def){
    const g=new THREE.Group();
    const body=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:def.fb,metalness:0.5,roughness:0.5}));
    body.scale.set(def.foot*0.6,0.8,def.foot); body.position.y=0.8; body.castShadow=true; g.add(body);
    for(let sx=-1;sx<=1;sx+=2)for(let sz=-1;sz<=1;sz+=2){ const w=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,10),new THREE.MeshStandardMaterial({color:0x111}));
        w.rotation.z=Math.PI/2; w.position.set(sx*def.foot*0.35,0.4,sz*def.foot*0.4); g.add(w); }
    return g;
}
function finalizeVehicleMesh(def, obj, onReady){
    const box=new THREE.Box3().setFromObject(obj); const size=new THREE.Vector3(); box.getSize(size);
    const s=def.foot/(Math.max(size.x,size.z)||1); obj.scale.setScalar(s);
    const b2=new THREE.Box3().setFromObject(obj); obj.position.y-=b2.min.y;
    obj.rotation.y=VEHICLE_MODEL_YAW;
    if(xzFog) xzFog.patchSubtree(obj);
    onReady(obj);
}
function loadVehicleMesh(def,onReady){
    if(!glbLoader||!def.glb){ onReady(fallbackVehicle(def)); return; }
    loadGLBWithFallback(brawlModelUrls(def.glb), gltf=>{
        const obj=gltf.scene.clone(true);
        const applyAndFinish=(tex)=>{
            applyVoxelPaletteMaterials(obj, tex);
            finalizeVehicleMesh(def, obj, onReady);
        };
        if(def.tex) loadVoxelPaletteTexture(def.tex, applyAndFinish, ()=>applyAndFinish(null));
        else applyAndFinish(null);
    }, ()=>onReady(fallbackVehicle(def)));
}
function spawnVehicles(){
    if(!player){ console.warn('spawnVehicles: player not ready'); return; }
    VEHICLE_DEFS.forEach((def,i)=>{
        const v=new THREE.Group();
        const ang=(i/VEHICLE_DEFS.length)*Math.PI*2;
        v.position.set(player.position.x+Math.cos(ang)*10, 0, player.position.z+Math.sin(ang)*10);
        v.userData={ isVehicle:true, def, speed:0, heading:ang, radius:vehicleColliderRadius({userData:{def}}) };
        // marker light so they're findable
        const l=new THREE.PointLight(0x66ddff,2,7); l.position.y=1.5; v.add(l); v.userData.marker=l;
        vehicles.push(v); obstacles.push(v); scene.add(v);
        loadVehicleMesh(def, mesh=>{ v.add(mesh); v.userData.mesh=mesh; if(xzFog) xzFog.patchSubtree(mesh); });
    });
}
function enterVehicle(v){
    playerVehicle=v; v.userData.marker.visible=false;
    const oi=obstacles.indexOf(v); if(oi>=0) obstacles.splice(oi,1);
    playerModel.visible=false;
    document.getElementById('build-btn').style.display='none';
    document.getElementById('melee-btn').style.display='none';
    addKillFeed(`driving ${v.userData.def.name} — SPACE = gas`);
}
function exitVehicle(){
    if(!playerVehicle) return;
    const v=playerVehicle; v.userData.speed=0; v.userData.marker.visible=true;
    // drop player just beside the vehicle
    const exitFwd=new THREE.Vector3(Math.sin(v.userData.heading),0,Math.cos(v.userData.heading));
    player.position.set(v.position.x+exitFwd.x*2.2, 0, v.position.z+exitFwd.z*2.2);
    v.userData.radius=vehicleColliderRadius(v);
    if(!obstacles.includes(v)) obstacles.push(v);
    playerModel.visible=true; playerVehicle=null;
    document.getElementById('build-btn').style.display='block';
    document.getElementById('melee-btn').style.display='block';
}
// arcade car physics (momentum + speed-proportional steering), modelled on the Escape-Road example
function updateVehicleDriving(dt){
    if(!playerVehicle) return;
    const v=playerVehicle, def=v.userData.def, ud=v.userData;
    let steer=0;
    if(isJoyActive) steer=joystickPos.x;
    else { if(keys.a) steer-=1; if(keys.d) steer+=1; }
    // throttle / brake / coast
    if(gasHeld) ud.speed=Math.min(def.maxSpeed, ud.speed+def.accel);
    else if(keys.s) ud.speed=Math.max(-def.maxSpeed*0.45, ud.speed-def.accel);
    else ud.speed*=def.grip;                          // coast w/ friction
    if(Math.abs(ud.speed)<0.002) ud.speed=0;
    // you only turn while rolling; tighter at speed, reversed in reverse
    const speedFrac=ud.speed/def.maxSpeed;
    ud.heading-=steer*def.turn*Math.min(1,Math.abs(speedFrac))*Math.sign(ud.speed||1);
    const h=ud.heading;
    const fwd=new THREE.Vector3(Math.sin(h),0,Math.cos(h));
    const fs=frameScale(dt);
    v.position.x+=fwd.x*ud.speed*fs; v.position.z+=fwd.z*ud.speed*fs;
    v.rotation.y=h;
    // slight body lean on hard turns
    if(ud.mesh) ud.mesh.rotation.z=THREE.MathUtils.lerp(ud.mesh.rotation.z||0, -steer*0.12*Math.min(1,Math.abs(speedFrac)), 0.2);
    player.position.copy(v.position);                 // rider follows (camera + drive-by origin)
    // plow through the dead
    if(Math.abs(ud.speed)>0.16){
        for(let j=enemies.length-1;j>=0;j--){ const e=enemies[j];
            if(e.position.distanceTo(v.position)<def.foot*0.7){
                damageEnemy(e, 2+Math.abs(ud.speed)*6); e.position.add(fwd.clone().multiplyScalar(2.0));
                spawnParticles(e.position.clone().add(new THREE.Vector3(0,1,0)),0xaa3322,4,0.3,0.1,8);
                screenShake=Math.max(screenShake,2.5); ud.speed*=0.96;
            } }
    }
    if(Math.abs(ud.speed)>0.1 && Math.random()>0.6) spawnParticles(v.position.clone().sub(fwd.clone().multiplyScalar(def.foot*0.5)).setY(0.4),0x555555,1,0.05,0.08,8);
}

const staticCache={};
function loadStaticGLB(key,target,mode,onReady){
    const make=(src)=>{ const root=src.clone(true);
        prepareMeshMaterials(root);
        const metrics=normalizeModel(root, mode==='height'?{height:target,centerXZ:true}:{foot:target,centerXZ:true});
        if(xzFog) xzFog.patchSubtree(root); onReady(root, metrics); };
    if(staticCache[key]==='FAIL') return;
    if(staticCache[key]&&staticCache[key]!=='LOADING'){ make(staticCache[key]); return; }
    if(!glbLoader) return;
    if(staticCache[key]==='LOADING'){ const iv=setInterval(()=>{ if(staticCache[key]&&staticCache[key]!=='LOADING'){ clearInterval(iv); if(staticCache[key]!=='FAIL') make(staticCache[key]); } },120); return; }
    staticCache[key]='LOADING';
    loadGLBWithFallback(brawlModelUrls(key), g=>{ staticCache[key]=g.scene; make(g.scene); }, ()=>{ staticCache[key]='FAIL'; });
}

function spawnResourceNode(pos,kind){
    const k=NODE_KINDS[kind]||NODE_KINDS.scrap;
    const g=new THREE.Group(); g.position.copy(pos);
    const n=5+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){ const s=0.35+Math.random()*0.55;
        const b=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:k.col,roughness:0.9,metalness:kind==='scrap'?0.5:0.1}));
        b.scale.set(s,s,s); b.position.set((Math.random()-0.5)*1.3,s/2+Math.random()*0.3,(Math.random()-0.5)*1.3); b.rotation.y=Math.random(); b.castShadow=true; g.add(b); }
    const glow=new THREE.PointLight(k.col,1.2,4); glow.position.y=1; g.add(glow);
    g.userData={ isNode:true, kind, color:k.col, hp:5, maxHp:5, radius:0.9 };
    resourceNodes.push(g); scene.add(g); return g;

function mineNode(n){
    const k=NODE_KINDS[n.userData.kind];
    n.userData.hp--;
    res[k.r]+=k.per;
    spawnParticles(n.position.clone().add(new THREE.Vector3(0,0.8,0)),n.userData.color,5,0.3,0.12,10);
    screenShake=Math.max(screenShake,1.2);
    if(n.userData.hp<=0){ res[k.r]+=k.bonus;
        spawnParticles(n.position.clone().setY(0.6),n.userData.color,14,0.4,0.15,16);
        scene.remove(n); resourceNodes=resourceNodes.filter(x=>x!==n);
        addKillFeed(`mined out (+${k.bonus} ${k.r})`);
    } else addKillFeed(`+${k.per} ${k.r}`);
    updateUI();
}

let homes=[], sheltered=false, shelterHome=null;
function generateCity(){
    const cx=44, cz=8;
    const TILE=CITY_TILE, HOUSE_FOOT=CITY_HOUSE_FOOT;
    for(let i=-3;i<=3;i++){
        loadStaticGLB('models/kenney/roads/road-straight.glb', TILE, 'foot', r=>{ r.position.set(cx+i*TILE,0.02,cz); r.rotation.y=Math.PI/2; scene.add(r); });
        loadStaticGLB('models/kenney/roads/road-straight.glb', TILE, 'foot', r=>{ r.position.set(cx,0.02,cz+i*TILE); scene.add(r); });
    }
    loadStaticGLB('models/kenney/roads/road-crossroad.glb', TILE, 'foot', r=>{ r.position.set(cx,0.03,cz); scene.add(r); });
    const houseTypes=['house_type01','house_type04','house_type07','house_type09','house_type12','house_type15','house_type18','house_type21'];
    let hi=0;
    for(let i=-2;i<=2;i++){ if(i===0) continue;
        [[cx+i*TILE, cz-TILE], [cx+i*TILE, cz+TILE]].forEach((p,side)=>{
            const ht=houseTypes[hi++%houseTypes.length];
            const face=side===0?0:Math.PI;
            const doorOff=HOUSE_FOOT*0.55+1;
            loadStaticGLB('models/city/'+ht+'.glb', HOUSE_FOOT, 'foot', (root,metrics)=>{
                root.position.set(p[0],0,p[1]); root.rotation.y=face;
                const rad=metrics?metrics.radius:HOUSE_FOOT*0.5;
                root.userData={ isHome:true, radius:rad, foot:HOUSE_FOOT,
                    door:new THREE.Vector3(p[0], 0, p[1]+(side===0?doorOff:-doorOff)) };
                homes.push(root); obstacles.push(root); scene.add(root);
            });
        });
    }
}
function enterHome(h){
    sheltered=true; shelterHome=h;
    player.position.set(h.position.x, 0, h.position.z);     // step inside
    h.traverse(c=>{ if(c.isMesh&&c.material){ const ms=Array.isArray(c.material)?c.material:[c.material]; ms.forEach(m=>{ m.transparent=true; m.opacity=0.32; m.depthWrite=false; }); } });
    addKillFeed('sheltered — safe inside');
}
function exitHome(){
    if(!shelterHome) return; const h=shelterHome;
    h.traverse(c=>{ if(c.isMesh&&c.material){ const ms=Array.isArray(c.material)?c.material:[c.material]; ms.forEach(m=>{ m.opacity=1; m.transparent=false; m.depthWrite=true; }); } });
    player.position.set(h.userData.door.x, 0, h.userData.door.z);
    sheltered=false; shelterHome=null; addKillFeed('left the house');
}

        obstacles.push(ruin); scene.add(ruin); }
    const lightMat=new THREE.MeshStandardMaterial({color:0x00ffff,emissive:0x00ffff,emissiveIntensity:0.5});
    for(let i=0;i<8;i++){ const g=new THREE.Group();
        const a=Math.random()*Math.PI*2,dist=22+Math.random()*80; g.position.set(Math.cos(a)*dist,0,Math.sin(a)*dist);
        const pole=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x080810,metalness:0.5}));
        pole.scale.set(0.15,6,0.15); pole.position.y=3; g.add(pole);
        const bulb=new THREE.Mesh(BOX_GEO,lightMat); bulb.scale.set(0.3,0.2,0.3); bulb.position.y=6; g.add(bulb);
        const pl=new THREE.PointLight(0x00ffff,6,15); pl.position.set(0,5.8,0); g.add(pl);
        g.userData.radius=0.5; obstacles.push(g); scene.add(g); }
    for(let i=0;i<24;i++){ const d=new THREE.Mesh(new THREE.BoxGeometry(0.1+Math.random()*0.4,0.1+Math.random()*0.3,0.1+Math.random()*0.4),
        new THREE.MeshStandardMaterial({color:0x222228,roughness:1}));
        const a=Math.random()*Math.PI*2,dist=Math.random()*100; d.position.set(Math.cos(a)*dist,0.1,Math.sin(a)*dist);
        d.rotation.set(Math.random(),Math.random(),Math.random()); d.receiveShadow=true; scene.add(d); }
    // scatter minable resource nodes (RMB / melee to harvest)
    const kinds=['scrap','wood','water'];
    for(let i=0;i<20;i++){ const a=Math.random()*Math.PI*2, dist=8+Math.random()*70;
        spawnResourceNode(new THREE.Vector3(player.position.x+Math.cos(a)*dist,0,player.position.z+Math.sin(a)*dist), kinds[i%3]); }
}

// ============================================================================
//  Events
// ============================================================================
function bindEvents(){
    window.onkeydown=(e)=>{ const k=e.key.toLowerCase();
        if(keys.hasOwnProperty(k)) keys[k]=true;
        if(document.getElementById('start-screen').style.display==='none'){
            if(k===' '){ e.preventDefault(); if(playerVehicle) gasHeld=true; else useAbility(); }
            if(k==='b' && !playerVehicle){ toggleBuildMode(); }
            if(k==='f') doMelee();
            if(k==='h') useMedicine();
            if(k==='r' && buildMode) rotateGhost();
            if(k==='e') tryInteract();
            const num=parseInt(e.key);
            if(num>=1&&num<=8 && !buildMode) selectWeapon(num-1);
            if(num>=1&&num<=9 && buildMode){ const idx=num-1; if(idx<BUILDABLES.length){ buildSel=idx; refreshGhost(); buildBuildBar(); } }
        }
    };
    window.onkeyup=(e)=>{ const k=e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k]=false; if(k===' ') gasHeld=false; };

    const handleInputPos=(e)=>refreshAimFromPointer(e);
    window.addEventListener('mousemove',handleInputPos);
    window.addEventListener('touchmove',handleInputPos,{passive:false});

    const startFire=(e)=>{ const target=e.target;
        if(document.getElementById('start-screen').style.display!=='none') return;
        if(target.closest('#bottom-controls')||target.closest('#squad-wrap')||target.closest('#squad-panel')||target.closest('#action-dock')||target.closest('.kpx-btn')||target.closest('#hud-top')||target.closest('#start-screen')) return;
        if(buildMode){
            handleInputPos(e);
            const b=BUILDABLES[buildSel];
            if(b&&b.drag){ beginWallDrag(); }
            else placeBuilding();
        } else isFiring=true; };
    window.addEventListener('mousedown',(e)=>{ if(e.button===2){ e.preventDefault(); refreshAimFromPointer(e); doMelee(e); return; } startFire(e); });
    window.addEventListener('mouseup',()=>{
        if(buildMode&&wallDrag&&wallDrag.active) endWallDrag();
        isFiring=false;
    });
    window.addEventListener('contextmenu',(e)=>{ if(document.getElementById('start-screen').style.display==='none') e.preventDefault(); });
    window.addEventListener('touchstart',(e)=>{ const target=e.target;
        if(document.getElementById('start-screen').style.display!=='none') return;
        if(target.closest('#bottom-controls')||target.closest('#squad-wrap')||target.closest('#squad-panel')||target.closest('#action-dock')||target.closest('.kpx-btn')||target.closest('#hud-top')||target.closest('#start-screen')) return;
        if(buildMode){
            handleInputPos(e);
            const b=BUILDABLES[buildSel];
            if(b&&b.drag) beginWallDrag(); else placeBuilding();
        } else isFiring=true;
    },{passive:true});
    window.addEventListener('touchend',()=>{
        if(buildMode&&wallDrag&&wallDrag.active) endWallDrag();
        isFiring=false;
    });

    const jWrap=document.getElementById('joystick-wrapper'), jStick=document.getElementById('joystick-stick');
    const updateJ=(e)=>{ const t=e.touches?e.touches[0]:e;
        const rect=jWrap.getBoundingClientRect(); const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
        const dx=t.clientX-cx, dy=t.clientY-cy; const dist=Math.min(Math.sqrt(dx*dx+dy*dy),50); const a=Math.atan2(dy,dx);
        joystickPos.x=(Math.cos(a)*dist)/50; joystickPos.y=(Math.sin(a)*dist)/50;
        jStick.style.transform=`translate(${joystickPos.x*28}px,${joystickPos.y*28}px)`; isJoyActive=true; };
    jWrap.addEventListener('touchstart',(e)=>{ e.preventDefault(); updateJ(e); });
    jWrap.addEventListener('touchmove',(e)=>{ e.preventDefault(); updateJ(e); });
    jWrap.addEventListener('touchend',()=>{ isJoyActive=false; jStick.style.transform='translate(0,0)'; joystickPos={x:0,y:0}; });
}
function tryInteract(){
    if(sheltered){ exitHome(); return; }
    if(playerVehicle){ exitVehicle(); return; }
    if(interactTarget){
        if(interactTarget.userData.isVendor){ buyFromVendor(interactTarget); return; }
        if(interactTarget.userData.isCivilian){ recruitCivilian(interactTarget); return; }
        if(interactTarget.userData.isHome){ enterHome(interactTarget); return; }
    }
    if(nearVehicle){ enterVehicle(nearVehicle); return; }
}
function updateInteract(){
    const ip=document.getElementById('interact-prompt');
    if(sheltered){ if(health<maxHealth) health=Math.min(maxHealth,health+12*0.016);
        ip.style.display='block'; ip.innerText='[E] Leave home  (sheltered)'; nearVehicle=null; interactTarget=null; return; }
    if(playerVehicle){ ip.style.display='block'; ip.innerText='[E] Exit vehicle  ·  SPACE = gas'; nearVehicle=null; interactTarget=null; return; }
    // nearest vehicle
    let bestV=null,bvd=4.5; vehicles.forEach(v=>{ const d=v.position.distanceTo(player.position); if(d<bvd){ bvd=d; bestV=v; } });
    nearVehicle=bestV;
    // nearest civilian / vendor / home
    let best=null,bd=3.0,kind='';
    civilians.forEach(c=>{ const d=c.position.distanceTo(player.position); if(d<bd){ bd=d; best=c; kind='civ'; } });
    vendors.forEach(v=>{ const d=v.position.distanceTo(player.position); if(d<bd){ bd=d; best=v; kind='vendor'; } });
    homes.forEach(h=>{ const d=h.position.distanceTo(player.position); if(d<(h.userData.radius||5)+1.5 && d<bd+3){ best=h; kind='home'; } });
    interactTarget=best;
    if(best&&kind==='vendor'){ ip.style.display='block'; ip.innerText=`[E] Trade — ${VENDOR_TRADES[best.userData.trade%VENDOR_TRADES.length].label}`; }
    else if(best&&kind==='home'){ ip.style.display='block'; ip.innerText='[E] Enter home'; }
    else if(best&&kind==='civ'){ ip.style.display='block'; ip.innerText=`[E] Rescue survivor  (squad ${allies.length}/5)`; }
    else if(nearVehicle){ ip.style.display='block'; ip.innerText=`[E] Drive ${nearVehicle.userData.def.name}  ·  SPACE = gas`; }
    else ip.style.display='none';
}

function onResize(){ const aspect=window.innerWidth/window.innerHeight;
    camera.left=-CAMERA_ZOOM*aspect; camera.right=CAMERA_ZOOM*aspect; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight); composer.setSize(window.innerWidth,window.innerHeight); }
function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
function selectWeapon(idx){ if(kills<WEAPONS[idx].unlock) return; currentWep=idx; minigunSpool=0;
    document.querySelectorAll('#equipment-bar .kpx-slot').forEach((el,i)=>el.classList.toggle('active',i===idx)); }

// ============================================================================
//  MAIN LOOP
// ============================================================================
function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(0.05,clock.getDelta());
    const started=document.getElementById('start-screen').style.display==='none';

    if(started){
        if(isFiring && !buildMode) fire();
        if(!isFiring && currentWep===7) minigunSpool=Math.max(0,minigunSpool-0.01);
        if(meleeCd>0) meleeCd-=dt;

        let movedOnFoot=false;
        const step=onFootSpeed*dt;
        if(playerVehicle){ updateVehicleDriving(dt); }
        else if(dashActive){ /* updateDash */ }
        else if(isJoyActive){ const angle=Math.atan2(joystickPos.y,joystickPos.x)-Math.PI/4;
            player.position.x+=Math.cos(angle)*step; player.position.z+=Math.sin(angle)*step; movedOnFoot=true; }
        else { let mx=0,mz=0; if(keys.w)mz-=1; if(keys.s)mz+=1; if(keys.a)mx-=1; if(keys.d)mx+=1;
            if(mx||mz){ const angle=Math.atan2(mz,mx)-Math.PI/4;
                player.position.x+=Math.cos(angle)*step; player.position.z+=Math.sin(angle)*step; movedOnFoot=true; } }
        if(player.userData.actions) playClip(player.userData, movedOnFoot?['walk','sprint']:['idle']);

        for(let i=0;i<enemies.length;i++) updateEnemy(enemies[i],dt);
        cullDistantEnemies();
        updateCivilians(dt); updateAllies(dt); updateBuildings(dt);
        updateCycle(dt);
        resolveCollisions();
        if(playerVehicle) playerVehicle.position.copy(player.position);
        interactAccum+=dt;
        if(interactAccum>=0.12){ interactAccum=0; updateInteract(); }

        if(!playerVehicle){ _toPlayer.copy(mouseWorld).sub(player.position).setY(0);
            if(_toPlayer.lengthSq()>0.1) player.rotation.y=Math.atan2(_toPlayer.x,_toPlayer.z)+(player.userData.faceYaw||0); }

        if(playerModel.userData.muzzleFlash) playerModel.userData.muzzleFlash.intensity*=0.65;

        updateProjectiles(dt); updatePickups(); updateParticles(); updateDash(dt);
        if(buildMode) updateGhost();

        if(player.userData.mixer) player.userData.mixer.update(dt);
        const simR2=ENEMY_SIM_RADIUS*ENEMY_SIM_RADIUS;
        for(const e of enemies){
            if(!e.userData.mixer) continue;
            e.userData.mixer.update(distSqTo(e)<=simR2?dt:dt*0.25);
        }
        for(const a of allies) if(a.userData.mixer) a.userData.mixer.update(dt);
        for(const c of civilians) if(c.userData.mixer) c.userData.mixer.update(dt);
        for(const v of vendors) if(v.userData.mixer) v.userData.mixer.update(dt);
        if(xzFog) xzFog.setPlayerPosition(player.position.x, player.position.z);

        if(comboTimer>0){ comboTimer-=dt; const ce=document.getElementById('combo-display');
            if(comboCount>1){ ce.style.opacity='1'; ce.innerText=`${comboCount}x COMBO!`;
                ce.style.color=comboCount>5?'#ff4444':comboCount>3?'#ffaa00':'#00ffcc'; }
            if(comboTimer<=0&&comboCount>0){ comboCount=0; ce.style.opacity='0'; } }

        for(const e of enemies){
            if(distSqTo(e)>simR2) continue;
            const el=clock.elapsedTime*1000-e.userData.spawnTime;
            const t=Math.min(1,el/e.userData.spawnDuration), eased=1-Math.pow(1-t,3);
            e.scale.setScalar(eased*e.userData.scaleTarget);
            e.position.y=t<0.5?(1-t*2)*1.0:0;
        }
        uiAccum+=dt;
        if(uiAccum>=UI_TICK){ uiAccum=0; updateUI(); }
    }

    if(screenShake>0){ camera.position.x+=(Math.random()-0.5)*screenShake*0.1; camera.position.y+=(Math.random()-0.5)*screenShake*0.1;
        screenShake*=0.85; if(screenShake<0.1) screenShake=0; }

    _camCenter.copy(player.position).add(_centeringOffset);
    camFocalPoint.lerp(_camCenter,0.1);
    camera.position.copy(camFocalPoint).add(_camOffset);
    camera.lookAt(camFocalPoint);

    if(useBloom && composer) composer.render();
    else renderer.render(scene,camera);
}

// ============================================================================
//  Kenney Pixel Adventure UI
// ============================================================================
function initKenneyUI(){
    if(typeof KenneyPixelUI==='undefined') return;
    KenneyPixelUI.applyTheme();
    renderStartMenu();
    WEAPONS.forEach((w,i)=>{
        const el=document.getElementById('slot-'+i);
        if(!el) return;
        el.setAttribute('data-tip-title', w.name);
        el.setAttribute('data-tip-body', (WEAPON_TIP_BODIES[i]||'')+' Unlock at '+w.unlock+' kills · '+w.cost+' scrap/shot');
    });
    KenneyPixelUI.bindTooltips();
}

// ============================================================================
//  INIT
// ============================================================================
function init(){
    initKenneyUI();
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x3a2230);
    xzFog=new XZFog(0x3a2230, 24, 108);   // XZ-plane mist; far = render distance
    scene.fog=xzFog;

    const aspect=window.innerWidth/window.innerHeight;
    camera=new THREE.OrthographicCamera(-CAMERA_ZOOM*aspect,CAMERA_ZOOM*aspect,CAMERA_ZOOM,-CAMERA_ZOOM,1,1000);
    camera.position.set(40,40,40); camera.lookAt(0,0,0);

    renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
    document.body.appendChild(renderer.domElement);

    const renderPass=new THREE.RenderPass(scene,camera);
    bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.4,0.3,0.85);
    bloomPass.threshold=0.6; bloomPass.strength=0.8;
    composer=new THREE.EffectComposer(renderer); composer.addPass(renderPass); composer.addPass(bloomPass);

    clock=new THREE.Clock();

    ambLight=new THREE.AmbientLight(0x334466,0.3); scene.add(ambLight);
    hemiLight=new THREE.HemisphereLight(0x8899bb,0x202018,0.4); scene.add(hemiLight);
    sunLight=new THREE.DirectionalLight(0xfff0dd,0.5); sunLight.position.set(-20,50,-10); sunLight.castShadow=true;
    sunLight.shadow.mapSize.width=512; sunLight.shadow.mapSize.height=512; scene.add(sunLight);

    floor=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),
        new THREE.MeshStandardMaterial({map:createFloorTexture(),roughness:0.9,metalness:0.1}));
    floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

    try {
        if(typeof THREE.GLTFLoader!=='undefined'){
            brawlLoaders=createBrawlLoaders();
            glbLoader=brawlLoaders.gltf;
        }
    } catch(e){ glbLoader=null; brawlLoaders=null; }
    try { if(typeof THREE.OBJLoader!=='undefined') objLoader=new THREE.OBJLoader(); } catch(e){ objLoader=null; }
    try { if(typeof THREE.MTLLoader!=='undefined') mtlLoader=new THREE.MTLLoader(); } catch(e){ mtlLoader=null; }

    const loadNote=document.getElementById('loadnote');
    if(loadNote) loadNote.textContent=glbLoader?'Loading survivor textures & models…':'WebGL ready (procedural fallback — GLTFLoader unavailable)';
    // Craftpix RPG UI graph boot (panels / slots / bars) before gameplay spin-up
    function finishBootUi(){
        if(typeof CraftpixRpgUI!=='undefined'){
            CraftpixRpgUI.decoratePanels(document);
            CraftpixRpgUI.decorateSlots(document);
            CraftpixRpgUI.refreshTooltips();
        } else if(typeof KenneyPixelUI!=='undefined' && KenneyPixelUI.refreshTooltips){
            KenneyPixelUI.refreshTooltips();
        }
    }
    const uiBoot=(typeof CraftpixRpgUI!=='undefined')
        ? CraftpixRpgUI.boot({
            compositions:['hudVitals','hudStockpile','hudPhase','hudDock','menuShell','weaponSlots','buildSlots'],
            onProgress:function(d,t){ if(loadNote) loadNote.textContent='UI pack '+d+'/'+t; }
          })
        : Promise.resolve();

    uiBoot.then(function(){
      preloadKenneyTextures(function(){
        setupPlayer(); generateWorld(); bindEvents();
        spawnVehicles();
        preloadProjectileMeshes();
        camFocalPoint.copy(player.position);
        spawnCivilian(); spawnCivilian(); spawnVendor();
        finishBootUi();
        if(loadNote) loadNote.textContent=glbLoader
          ? 'Craftpix RPG UI · camp pack · GLB world ready'
          : 'Craftpix UI ready · procedural world fallback';
        try{ console.info('[z-brawl] UI graph\n'+(CraftpixRpgUI&&CraftpixRpgUI.graphDot?CraftpixRpgUI.graphDot():'')); }catch(e){}
      });
    }).catch(function(){
      preloadKenneyTextures(function(){
        setupPlayer(); generateWorld(); bindEvents();
        spawnVehicles(); preloadProjectileMeshes();
        camFocalPoint.copy(player.position);
        spawnCivilian(); spawnCivilian(); spawnVendor();
        finishBootUi();
      });
    });
    xzFog.attachScene(scene);              // patch existing + future meshes for XZ fog
    generateCity();
    window.addEventListener('resize',onResize);

    // seed: survivors to find, a trader, day fog range (spawned in preload callback)
    applyFogForPhase();
    setTimeout(()=>{ document.getElementById('ability-btn').style.display='block'; },1000);
    updateUI();
    animate();
}
window.onload=init;
</script>
