<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Z-BRAWL: PROTOCOL EXTINCTION — Last Light</title>
<script src="js/grudge-env.js"></script>
<script src="js/grudge-asset-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>if(typeof THREE!=='undefined'&&!THREE.GLTFLoader){document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\\/script>');}</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<link rel="stylesheet" href="ui/craftpix-rpg/craftpix-rpg-ui.css">
<script src="js/craftpix-rpg-ui.js"></script>
<style>
/* Z-Brawl layout shell — surfaces/chrome come from craftpix-rpg-ui.css */
:root {
    --accent:#5eb6e8; --danger:#e0553a; --warning:#e8c46a; --good:#6dce5a;
    --water:#5eb6e8; --wood:#c48a4a; --food:#6dce5a; --med:#e0553a; --scrap:#9aa3b5;
    --hud-pad:12px; --dock-bottom:178px;
}
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05040a;
    touch-action:none; position:fixed; -webkit-user-select:none; user-select:none;
    font-family:var(--cpx-font); color:var(--cpx-ink); }
#ui-layer { position:absolute; inset:0; pointer-events:none; z-index:10; }

/* ---- Top HUD graph: vitals | stockpile | tools / phase ---- */
#hud-top { position:absolute; top:var(--hud-pad); left:var(--hud-pad); right:var(--hud-pad);
    display:grid; grid-template-columns:minmax(160px,1.15fr) minmax(240px,2.2fr) auto;
    gap:10px; align-items:start; pointer-events:none; }
#hud-top > * { pointer-events:auto; }
.hud-panel-head { font-size:var(--cpx-fs-xs); color:var(--cpx-gold); letter-spacing:0.14em; margin:0 0 6px; text-align:center; text-transform:uppercase; }
#stats-bar { min-width:0; }
#stats-bar.cpx-panel, #stats-bar.kpx-panel {
    border-image-source: var(--cpx-uf);
    border-image-slice: 36 40 44 40 fill;
    border-width: 16px 18px 18px 18px;
    border-image-width: 16px 18px 18px 18px;
}
.stat-text { font-size:var(--cpx-fs-md); text-shadow:var(--cpx-shadow); margin:3px 0; color:var(--cpx-ink); line-height:1.45; }
#health-text { color:var(--cpx-good); font-size:var(--cpx-fs-lg); font-weight:800; }
#ammo-count { color:var(--cpx-gold); }
#stats { color:var(--cpx-danger); display:flex; align-items:center; gap:6px; }
#stats::before { content:''; width:16px; height:16px; background:var(--cpx-ico-skull) center/contain no-repeat; image-rendering:pixelated; display:inline-block; }
#hp-bar { width:100%; margin-top:6px; }

#resource-bar { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:8px 10px !important; align-items:end; }
#resource-bar.cpx-panel, #resource-bar.kpx-panel {
    border-image-source: var(--cpx-top-bar);
    border-image-slice: 28 36 32 36 fill;
    border-width: 14px 18px 16px 18px;
    border-image-width: 14px 18px 16px 18px;
}
#r-wood .val{color:var(--cpx-wood);} #r-food .val{color:var(--cpx-good);} #r-water .val{color:var(--cpx-water);}
#r-med .val{color:var(--cpx-danger);} #r-scrap .val{color:var(--cpx-scrap);}

#hud-top-right { display:flex; align-items:flex-start; gap:6px; }
#fullscreen-btn { min-width:48px; min-height:48px !important; padding:0 !important; background:var(--cpx-btn-sm) center/100% 100% no-repeat !important; font-size:16px !important; }

#clock-box { grid-column:1 / -1; justify-self:center; width:min(94vw,380px); text-align:center; }
#clock-box.cpx-panel, #clock-box.kpx-panel {
    border-image-source: var(--cpx-timer);
    border-image-slice: 28 40 32 40 fill;
    border-width: 14px 22px 16px 22px;
    border-image-width: 14px 22px 16px 22px;
}
#phase-text { font-size:var(--cpx-fs-lg); letter-spacing:0.08em; color:var(--cpx-ink); font-weight:800; }
#phase-track { width:100%; max-width:320px; margin:8px auto 0; }
#phase-track.cpx-bar, #phase-track.kpx-bar {
    border-image-source: var(--cpx-xp-empty);
    border-image-slice: 8 16 fill;
    height: 16px;
}
#phase-fill { display:block; height:100%; width:0%; background:var(--cpx-xp-fill) left center/auto 100% repeat-x !important; transition:width 0.3s; image-rendering:pixelated; }
#density-text { font-size:var(--cpx-fs-xs); color:var(--cpx-ink-dim); margin-top:5px; line-height:1.45; }

#boss-wrap { position:absolute; top:128px; left:50%; transform:translateX(-50%); display:none; text-align:center; z-index:12; }
#boss-label { font-size:var(--cpx-fs-md); color:var(--cpx-danger); margin-bottom:6px; display:block; letter-spacing:0.1em; font-weight:800; }
#boss-bar-container { width:min(82vw,320px); }

#squad-wrap { position:absolute; top:108px; right:var(--hud-pad); width:min(42vw,200px); pointer-events:auto; }
#squad-head { font-size:var(--cpx-fs-xs); color:var(--cpx-gold); margin-bottom:5px; text-align:center; letter-spacing:0.14em; }
#squad-panel { display:flex; flex-direction:column; gap:6px; }
.squad-member {
    border-style:solid; border-width:12px 14px; border-color:transparent;
    border-image-source:var(--cpx-paper); border-image-slice:24 28 fill; border-image-width:12px 14px;
    font-size:var(--cpx-fs-xs); color:var(--cpx-ink-dark); cursor:pointer; text-shadow:none;
}
.squad-member .nm { font-size:var(--cpx-fs-md); color:#3a2814; display:block; font-weight:800; }
.squad-member .jb { color:#5a3a18; display:block; margin-top:3px; font-size:var(--cpx-fs-xs); }
.squad-member .hpbar { height:12px; margin-top:5px; border-style:solid; border-width:4px 6px; border-color:transparent;
    border-image-source:var(--cpx-lb-frame); border-image-slice:8 12 fill; border-image-width:4px 6px; overflow:hidden; background:rgba(0,0,0,0.25); }
.squad-member .hpfill { display:block; height:100%; background:var(--cpx-hp-fill) left/auto 100% repeat-x; image-rendering:pixelated; transition:width 0.2s; }
.squad-empty {
    border-style:solid; border-width:12px 14px; border-color:transparent;
    border-image-source:var(--cpx-paper); border-image-slice:24 28 fill; border-image-width:12px 14px;
    font-size:var(--cpx-fs-xs); color:#5a3a18; text-align:center; line-height:1.55;
}

#combo-display { position:absolute; top:50%; left:50%; transform:translate(-50%,-80px);
    font-size:var(--cpx-fs-title); color:var(--cpx-gold); text-shadow:3px 3px 0 #000; opacity:0; transition:opacity 0.2s; pointer-events:none; font-weight:900; letter-spacing:0.08em; }

#interact-prompt { position:absolute; bottom:var(--dock-bottom); left:50%; transform:translateX(-50%); display:none; pointer-events:none;
    font-size:var(--cpx-fs-md); color:var(--cpx-ink-dark); text-align:center; max-width:min(92vw,440px);
    border-image-source:var(--cpx-paper) !important; }

/* ---- Action dock ---- */
#action-dock { position:absolute; left:var(--hud-pad); bottom:var(--dock-bottom); display:flex; flex-wrap:wrap; gap:6px;
    max-width:min(50vw,300px); pointer-events:auto; }
#action-dock .kpx-btn, #action-dock .cpx-btn { flex:1 1 calc(50% - 6px); min-width:100px; font-size:var(--cpx-fs-md) !important; padding:10px 8px !important; }
#build-actions { display:none; width:100%; flex-direction:row; gap:6px; pointer-events:auto; }
#build-actions .kpx-btn { flex:1; min-width:0; font-size:var(--cpx-fs-sm) !important; }

#bottom-controls { position:absolute; bottom:0; left:0; width:100%; height:164px;
    display:flex; align-items:flex-end; gap:12px; padding:12px 14px 16px; box-sizing:border-box;
    background:
        var(--cpx-bottom-bar) center bottom / min(1400px,120%) auto no-repeat,
        linear-gradient(transparent 0%, rgba(8,6,14,0.45) 28%, rgba(8,6,14,0.97) 100%);
    image-rendering:pixelated; pointer-events:none; }
#bottom-controls > * { pointer-events:auto; }
#joystick-wrapper { width:104px; height:104px; flex-shrink:0; }
#joystick-base {
    width:100%; height:100%; position:relative;
    background:var(--cpx-joy) center/100% 100% no-repeat; image-rendering:pixelated;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5));
}
#joystick-stick {
    width:44px; height:44px; position:absolute; top:30px; left:30px;
    background:var(--cpx-joy-inner) center/100% 100% no-repeat; image-rendering:pixelated;
}

#weapon-wrap { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
#weapon-label, #build-label { font-size:var(--cpx-fs-xs); color:var(--cpx-gold); letter-spacing:0.12em; padding-left:8px; text-shadow:1px 1px 0 #000; text-transform:uppercase; }
#equipment-bar, #build-bar {
    display:flex; justify-content:flex-start; gap:8px; padding:16px 20px 18px; overflow-x:auto; max-width:100%; scrollbar-width:thin;
    background:var(--cpx-action-bar) center/100% 100% no-repeat; image-rendering:pixelated;
    border:none !important; border-image:none !important; min-height:78px; box-sizing:border-box;
}
#build-bar { display:none; }
#build-label { display:none; }

#kill-feed { position:absolute; bottom:var(--dock-bottom); right:var(--hud-pad); pointer-events:none; width:min(36vw,240px); text-align:right; }
@keyframes fadeKill { 0%{opacity:0;transform:translateY(8px);} 15%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;transform:translateY(-14px);} }
.kpx-feed-msg, .cpx-feed-msg {
    opacity:0; animation:fadeKill 2.4s forwards; color:var(--cpx-ink); text-shadow:2px 2px 0 #000;
    margin:4px 0; font-size:var(--cpx-fs-sm); font-weight:700;
}

#vignette { position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 200px 40px rgba(120,0,0,0); transition:box-shadow 0.25s; }

/* ---- Start / game-over menu (craftpix containers) ---- */
#start-screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:100; padding:20px 16px; box-sizing:border-box; overflow-y:auto; }
.menu-backdrop {
    position:absolute; inset:0; pointer-events:none;
    background:
        radial-gradient(ellipse 80% 55% at 50% 18%, rgba(180,40,30,0.24) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 15% 85%, rgba(40,80,140,0.18) 0%, transparent 50%),
        radial-gradient(ellipse 50% 35% at 90% 70%, rgba(180,140,40,0.12) 0%, transparent 50%),
        linear-gradient(180deg, #1a1428 0%, #0a0812 48%, #05040a 100%);
}
.menu-backdrop::before {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0.28;
    background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 3px),
        radial-gradient(circle at 20% 30%, rgba(255,200,120,0.1), transparent 42%),
        radial-gradient(circle at 80% 20%, rgba(120,160,255,0.07), transparent 38%);
    mix-blend-mode:screen;
}
.menu-backdrop::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
        linear-gradient(90deg, rgba(0,0,0,0.55) 0%, transparent 16%, transparent 84%, rgba(0,0,0,0.55) 100%),
        linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.45) 100%);
}
.menu-shell { position:relative; width:min(96vw,740px); max-height:min(96vh,840px); display:flex; flex-direction:column; gap:12px; z-index:1; }
.menu-panel {
    position:relative; flex:1; overflow-y:auto;
    border-style:solid !important; border-width:34px 40px 40px 40px !important; border-color:transparent !important;
    border-image-source:var(--cpx-login) !important;
    border-image-slice:68 80 80 80 fill !important;
    border-image-width:34px 40px 40px 40px !important;
    background:transparent !important;
    color:var(--cpx-ink);
}

.menu-hero { text-align:center; margin-bottom:14px; padding-bottom:12px; }
.menu-banner {
    display:inline-block; padding:14px 32px; margin:0 0 10px;
    background:var(--cpx-btn) center/100% 100% no-repeat; image-rendering:pixelated;
    font-size:var(--cpx-fs-title); color:#fff8e8; text-shadow:3px 3px 0 #000; letter-spacing:0.12em; line-height:1.35; font-weight:900;
}
.menu-tag { font-size:var(--cpx-fs-md); color:var(--cpx-gold); letter-spacing:0.12em; margin:0 0 10px; text-transform:uppercase; }
.menu-pitch { font-size:var(--cpx-fs-md); color:var(--cpx-ink); line-height:1.65; margin:0 auto; max-width:52ch; }

.menu-cycle { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.menu-cycle-card {
    text-align:left;
    border-style:solid !important; border-width:16px 18px !important; border-color:transparent !important;
    border-image-source:var(--cpx-paper) !important;
    border-image-slice:28 32 fill !important;
    border-image-width:16px 18px !important;
    background:transparent !important;
    color:var(--cpx-ink-dark) !important;
    text-shadow:none !important;
}
.menu-cycle-card h3 { margin:0 0 8px; font-size:var(--cpx-fs-lg); letter-spacing:0.06em; display:flex; align-items:center; gap:8px; color:#3a2814; }
.menu-cycle-card--day h3 { color:#2a6a3a; }
.menu-cycle-card--night h3 { color:#8a2a1a; }
.menu-cycle-card .cycle-icon { font-size:16px; line-height:1; }
.menu-cycle-card ul { margin:0; padding:0; list-style:none; }
.menu-cycle-card li { margin:5px 0; font-size:var(--cpx-fs-md); line-height:1.5; color:#3a2814; padding-left:14px; position:relative; }
.menu-cycle-card li::before { content:'›'; position:absolute; left:0; color:#8a6a40; }

.menu-manual {
    margin-bottom:12px;
    border-style:solid !important; border-width:16px 18px !important; border-color:transparent !important;
    border-image-source:var(--cpx-paper) !important;
    border-image-slice:28 32 fill !important;
    border-image-width:16px 18px !important;
    background:transparent !important;
    color:var(--cpx-ink-dark) !important;
    text-shadow:none !important;
}
.menu-manual-head { font-size:var(--cpx-fs-lg); color:#5a3a18; letter-spacing:0.1em; margin:0 0 10px; text-align:center; text-transform:uppercase; }
.menu-controls-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px 14px; }
.menu-ctrl-group h4 { margin:0 0 6px; font-size:var(--cpx-fs-md); color:#5a3a18; letter-spacing:0.05em; }
.menu-ctrl-row { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:var(--cpx-fs-md); color:#3a2814; line-height:1.4; }
.menu-ctrl-row kbd {
    flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; min-width:36px; min-height:28px; padding:4px 8px;
    background:var(--cpx-slot-sm) center/100% 100% no-repeat; image-rendering:pixelated;
    font-family:var(--cpx-font); font-size:var(--cpx-fs-sm); color:#f4e6c8; text-shadow:1px 1px 0 #000; font-weight:800;
}
.menu-ctrl-row span { flex:1; }

.menu-highlights { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:4px; }
.menu-highlight {
    text-align:center; font-size:var(--cpx-fs-xs); color:var(--cpx-ink-dark);
    border-style:solid !important; border-width:12px 14px !important; border-color:transparent !important;
    border-image-source:var(--cpx-paper) !important;
    border-image-slice:24 28 fill !important;
    border-image-width:12px 14px !important;
    background:transparent !important;
    text-shadow:none !important;
}
.menu-highlight .hl-icon { display:block; width:28px; height:28px; margin:0 auto 6px; background-size:contain; background-position:center; background-repeat:no-repeat; image-rendering:pixelated; font-size:0; }
.menu-highlight:nth-child(1) .hl-icon { background-image:var(--cpx-ico-hammer); }
.menu-highlight:nth-child(2) .hl-icon { background-image:var(--cpx-ico-fist); }
.menu-highlight:nth-child(3) .hl-icon { background-image:var(--cpx-ico-heart); }
.menu-highlight:nth-child(4) .hl-icon { background-image:var(--cpx-ico-tower); }
.menu-highlight strong { display:block; font-size:var(--cpx-fs-sm); color:#3a2814; margin-bottom:3px; }

.menu-cta-wrap { flex-shrink:0; }
.menu-cta {
    width:100%; min-height:56px !important; font-size:var(--cpx-fs-xl) !important; letter-spacing:0.1em;
    background:var(--cpx-btn) center/100% 100% no-repeat !important; color:#fff8e8 !important;
}
.menu-cta:hover { background-image:var(--cpx-btn-hover) !important; }
.menu-cta:active { background-image:var(--cpx-btn-push) !important; }
@keyframes ctaPulse { 0%,100%{filter:brightness(1) drop-shadow(0 0 0 transparent);} 50%{filter:brightness(1.1) drop-shadow(0 0 12px rgba(232,196,106,0.45));} }
.menu-cta:not(:disabled) { animation:ctaPulse 2.4s ease-in-out infinite; }
.menu-foot { font-size:var(--cpx-fs-xs); opacity:0.85; margin-top:8px; color:var(--cpx-ink-dim); line-height:1.55; text-align:center; }

.menu-stats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 12px; margin-bottom:12px; }
.menu-stat {
    font-size:var(--cpx-fs-md); color:var(--cpx-ink); padding:8px 12px;
    background:var(--cpx-slot) center/100% 100% no-repeat; image-rendering:pixelated; min-width:72px; text-align:center;
}
.menu-stat em { font-style:normal; color:var(--cpx-danger); font-weight:800; }

@media (max-width:640px) {
    .menu-cycle, .menu-controls-grid { grid-template-columns:1fr; }
    .menu-highlights { grid-template-columns:repeat(2,1fr); }
}
@media (max-width:520px) {
    :root { --dock-bottom:164px; }
    #hud-top { grid-template-columns:1fr 1fr; }
    #resource-bar { grid-column:1 / -1; grid-template-columns:repeat(5,1fr); }
    #clock-box { grid-column:1 / -1; }
    #action-dock .kpx-btn { min-width:88px; font-size:var(--cpx-fs-sm) !important; }
    .menu-banner { font-size:16px; padding:12px 18px; }
    #equipment-bar, #build-bar { padding:12px 14px 14px; min-height:68px; }
}
</style>
</head>
<body>
<div id="ui-layer">
    <div id="hud-top">
        <div id="stats-bar" class="kpx-panel kpx-panel--compact kpx-pixel cpx-panel cpx-panel--uf cpx-pixel" data-cpx-node="unitframe">
            <p class="hud-panel-head cpx-head cpx-head--icon">Vitals</p>
            <div class="stat-text" id="health-text">HP 100</div>
            <div class="kpx-bar cpx-bar cpx-bar--hp" id="hp-bar"><i id="hp-fill"></i></div>
            <div class="stat-text" id="ammo-count">AMMO 30</div>
            <div class="stat-text" id="stats">0</div>
        </div>
        <div id="resource-bar" class="kpx-panel kpx-panel--compact kpx-pixel cpx-panel cpx-panel--topbar cpx-pixel" data-cpx-node="topBar">
            <p class="hud-panel-head cpx-head">Stockpile</p>
            <div class="kpx-res cpx-res cpx-res--wood" id="r-wood" data-tip-title="WOOD" data-tip-body="Walls, farms, campfires."><span class="ic" aria-hidden="true">🪵</span><span class="val" id="v-wood">0</span></div>
            <div class="kpx-res cpx-res cpx-res--food" id="r-food" data-tip-title="FOOD" data-tip-body="Feed survivors and farms."><span class="ic" aria-hidden="true">🌾</span><span class="val" id="v-food">0</span></div>
            <div class="kpx-res cpx-res cpx-res--water" id="r-water" data-tip-title="WATER" data-tip-body="Farms and thirsty allies."><span class="ic" aria-hidden="true">💧</span><span class="val" id="v-water">0</span></div>
            <div class="kpx-res cpx-res cpx-res--med" id="r-med" data-tip-title="MED" data-tip-body="H — heal with a kit."><span class="ic" aria-hidden="true">✚</span><span class="val" id="v-med">0</span></div>
            <div class="kpx-res cpx-res cpx-res--scrap" id="r-scrap" data-tip-title="SCRAP" data-tip-body="Guns and turrets."><span class="ic" aria-hidden="true">⚙</span><span class="val" id="v-scrap">0</span></div>
        </div>
        <div id="hud-top-right">
            <button id="fullscreen-btn" class="kpx-btn kpx-btn--brown kpx-pixel cpx-btn cpx-btn--icon cpx-pixel" onclick="toggleFullscreen()" data-tip-title="FULLSCREEN" data-tip-body="Toggle immersive view.">⛶</button>

// ===========================================================================
//  XZFog — horizontal (XZ-plane) distance fog for top-down view.
//  Ported to three r128. Doubles as render-distance: 'far' is the cull radius.
//  Credit: discourse.threejs.org/t/xzfog-…/87619
// ===========================================================================
class XZFog extends THREE.Fog {
    constructor(color, near=1, far=1000){
        super(color, near, far);
        this.isXZFog=true;
        this.scene=null;
        this.patched=new WeakSet();        // each material injected exactly once
        // shared uniform objects — every patched shader references these (O(1) updates, no leak)
        this.uPos={value:new THREE.Vector2(0,0)};
        this.uNear={value:near};
        this.uFar={value:far};
    }
    setPlayerPosition(x,z){ this.uPos.value.set(x,z); }
    setRange(near,far){ this.near=near; this.far=far; this.uNear.value=near; this.uFar.value=far; }
    attachScene(scene){
        this.scene=scene;
        this.patchSubtree(scene);
        const orig=scene.add.bind(scene);
        scene.add=(...objs)=>{ const r=orig(...objs); for(const o of objs) this.patchSubtree(o); return r; };
        this._origAdd=orig;
    }
    patchSubtree(obj){ if(obj) obj.traverse(o=>{ if((o.isMesh||o.isInstancedMesh)&&o.material) this.patchMesh(o); }); }
    patchMesh(mesh){
        const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
        for(const mat of mats){ if(mat && !this.patched.has(mat)){ this.patchMaterial(mat); this.patched.add(mat); } }
    }
    patchMaterial(material){
        if(!material || material.fog===false) return;               // skip tracers/particles flagged noFog
        if(material.type&&material.type.indexOf('Line')===0) return;
        if(material.fog===undefined) material.fog=true;
        const prev=material.onBeforeCompile, hasPrev=typeof prev==='function';
        const self=this;
        material.onBeforeCompile=(shader)=>{
            if(hasPrev) prev.call(material,shader);
            if(shader.fragmentShader.indexOf('vWorldPosXZ')!==-1) return;  // already injected — never double up
            shader.uniforms.playerPositionXZ=self.uPos;   // shared refs
            shader.uniforms.xzFogNear=self.uNear;
            shader.uniforms.xzFogFar=self.uFar;
            shader.vertexShader=shader.vertexShader.replace('void main() {',
                'uniform vec2 playerPositionXZ;\nvarying vec3 vWorldPosXZ;\nvoid main() {');
            shader.vertexShader=shader.vertexShader.replace(/}\s*$/,
                '\nvec4 wpXZ = modelMatrix * vec4(position,1.0);\nvWorldPosXZ = wpXZ.xyz;\n}');
            shader.fragmentShader=shader.fragmentShader.replace('void main() {',
                'uniform vec2 playerPositionXZ;\nuniform float xzFogNear;\nuniform float xzFogFar;\nvarying vec3 vWorldPosXZ;\nvoid main() {');
            shader.fragmentShader=shader.fragmentShader.replace('#include <fog_fragment>',
                `#ifdef USE_FOG
float xzd = length(vWorldPosXZ.xz - playerPositionXZ);
float xzf = smoothstep(xzFogNear, xzFogFar, xzd);
gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, xzf);
#endif`);
        };
        material.needsUpdate=true;
    }
}

// ============================================================================
//  GLB loading (cached + clone, with procedural fallback)
// ============================================================================
function preloadKenneyTextures(onDone){
    if(typeof THREE.TextureLoader==='undefined'){ if(onDone) onDone(); return; }
    const loader=(brawlLoaders&&brawlLoaders.texLoader)?brawlLoaders.texLoader:new THREE.TextureLoader();
    const letters='abcdefghijklmnopqr'.split('');
    let done=0;
    letters.forEach(letter=>{
        loader.load(brawlModelUrl('models/kenney/textures/texture-'+letter+'.png'), tex=>{
            tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter;
            tex.encoding=THREE.sRGBEncoding; KENNEY_TEX_CACHE[letter]=tex;
            done++; if(done>=letters.length&&onDone) onDone();
        }, undefined, ()=>{ done++; if(done>=letters.length&&onDone) onDone(); });
    });
}
function applyKenneyTexture(root, letter){
    if(!root||!letter) return;
    const tex=KENNEY_TEX_CACHE[letter];
    if(!tex){
        if(typeof THREE.TextureLoader==='undefined') return;
        new THREE.TextureLoader().load(brawlModelUrl('models/kenney/textures/texture-'+letter+'.png'), t=>{
            t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.encoding=THREE.sRGBEncoding;
            KENNEY_TEX_CACHE[letter]=t; applyKenneyTexture(root, letter);
        });
        return;
    }
    root.traverse(c=>{
        if(!c.isMesh||!c.material) return;
        const ms=Array.isArray(c.material)?c.material:[c.material];
        ms.forEach(m=>{
            if(m.color) m.color.setHex(0xffffff);
            m.map=tex;
            if('roughness' in m) m.roughness=0.85;
            if('metalness' in m) m.metalness=0.05;
            m.needsUpdate=true;
        });
    });
}
function nativeHeightForModel(glbPath){
    if(!glbPath) return null;
    if(glbPath.indexOf('kenney/')>=0) return KENNEY_NATIVE_H;
    for(const k in CREATURE_NATIVE_H){ if(glbPath.indexOf(k)>=0) return CREATURE_NATIVE_H[k]; }
    return null;
}
function prepareMeshMaterials(root, opts){
    root.traverse(c=>{
        if(!c.isMesh) return;
        c.castShadow=true; c.receiveShadow=true;
        if(c.geometry&&!c.geometry.attributes.normal) c.geometry.computeVertexNormals();
        if(!c.material) return;
        const ms=Array.isArray(c.material)?c.material:[c.material];
        const out=ms.map(m=>{
            const cl=m.clone();
            if(cl.map){ cl.map.encoding=THREE.sRGBEncoding; cl.map.needsUpdate=true; }
            if(cl.emissiveMap) cl.emissiveMap.encoding=THREE.sRGBEncoding;
            cl.fog=!(opts&&opts.noFog); if(c.isSkinnedMesh) cl.skinning=true;
            cl.side=THREE.FrontSide; cl.depthWrite=true;
            return cl;
        });
        c.material=out.length===1?out[0]:out;
    });
    if(opts&&opts.kenneyTex) applyKenneyTexture(root, opts.kenneyTex);
    if(opts&&opts.modelYaw) root.rotation.y=opts.modelYaw;
}
function normalizeModel(root, opts){
    const box=new THREE.Box3().setFromObject(root);
    const size=new THREE.Vector3(); box.getSize(size);
    let s=1;
    if(opts.height){
        const native=opts.nativeH||(size.y||1);
        s=opts.height/native;
    } else if(opts.foot){
        s=opts.foot/(Math.max(size.x,size.z)||1);
    }
    root.scale.multiplyScalar(s);
    const box2=new THREE.Box3().setFromObject(root);
    root.position.y-=box2.min.y;
    if(opts.centerXZ){
        const cen=new THREE.Vector3(); box2.getCenter(cen);
        root.position.x-=cen.x; root.position.z-=cen.z;
    }
    const box3=new THREE.Box3().setFromObject(root);
    const sz3=new THREE.Vector3(); box3.getSize(sz3);
    return { radius:Math.max(sz3.x,sz3.z)*0.5, height:sz3.y };
}
function snapToFoot(v, foot){ const step=foot||GRID; return Math.round(v/step)*step; }
function scaleOptsFor(b){
    if(!b) return { foot:GRID, centerXZ:true };
    if(b.height) return { height:b.height, centerXZ:true };
    return { foot:b.foot||GRID, centerXZ:true };
}
function buildingOverlap(gx, gz, foot, ignoreList){
    const ignore=ignoreList||[];
    return buildings.some(bl=>{
        if(ignore.indexOf(bl)>=0) return false;
        const bf=(bl.userData.def&&bl.userData.def.foot)||GRID;
        return Math.hypot(bl.position.x-gx, bl.position.z-gz)<(foot+bf)*0.48;
    });
}
function loadGLB(key, scaleOpts, onReady, fallbackBuilder){
    if(!key){ const obj=fallbackBuilder&&fallbackBuilder(); if(obj) onReady(obj); return; }
    const opts=typeof scaleOpts==='number'?{ foot:scaleOpts, centerXZ:true }:(scaleOpts||{ foot:2, centerXZ:true });
    if(glbCache[key]==='FAIL'){ const obj=fallbackBuilder&&fallbackBuilder(); if(obj) onReady(obj); return; }
    if(glbCache[key] && glbCache[key]!=='LOADING'){
        onReady(prepClone(glbCache[key], opts)); return;
    }
    if(!glbLoader){ const obj=fallbackBuilder&&fallbackBuilder(); if(obj) onReady(obj); return; }
    if(glbCache[key]==='LOADING'){
        const iv=setInterval(()=>{
            if(glbCache[key] && glbCache[key]!=='LOADING'){ clearInterval(iv);
                const obj=glbCache[key]==='FAIL'?(fallbackBuilder&&fallbackBuilder()):prepClone(glbCache[key],opts);
                if(obj) onReady(obj);
            }
        },120);
        return;
    }
    glbCache[key]='LOADING';
    loadGLBWithFallback(brawlModelUrls(key), gltf=>{
        glbCache[key]=gltf.scene;
        onReady(prepClone(gltf.scene, opts));
    }, ()=>{ glbCache[key]='FAIL'; const obj=fallbackBuilder&&fallbackBuilder(); if(obj) onReady(obj); });
}
function prepClone(src, scaleOpts){
    const opts=typeof scaleOpts==='number'?{ foot:scaleOpts, centerXZ:true }:(scaleOpts||{ foot:2, centerXZ:true });
    const obj=src.clone(true);
    prepareMeshMaterials(obj);
    normalizeModel(obj, opts);
    if(xzFog) xzFog.patchSubtree(obj);
    return obj;
}

/** Axis-aligned wall run cells from A→B (inclusive), snap step = foot. */
function wallRunCells(x0,z0,x1,z1,foot){
    const step=foot||GRID;
    const sx=snapToFoot(x0,step), sz=snapToFoot(z0,step);
    const ex=snapToFoot(x1,step), ez=snapToFoot(z1,step);
    const dx=ex-sx, dz=ez-sz;
    // Prefer dominant axis ( fort walls )
    const alongX=Math.abs(dx)>=Math.abs(dz);
    const cells=[];
    if(alongX){
        const n=Math.max(1, Math.round(Math.abs(dx)/step)+1);
        const dir=dx>=0?1:-1;
        for(let i=0;i<n;i++) cells.push({ x:sx+dir*i*step, z:sz, yaw:Math.PI/2 });
    } else {
        const n=Math.max(1, Math.round(Math.abs(dz)/step)+1);
        const dir=dz>=0?1:-1;
        for(let i=0;i<n;i++) cells.push({ x:sx, z:sz+dir*i*step, yaw:0 });
    }
    return cells;
}
/** Neighbor link mask for auto-corner / rotation. */
function wallNeighborMask(gx,gz,foot,link){
    const step=foot||GRID;
    let mask=0; // N=1 E=2 S=4 W=8
    buildings.forEach(bl=>{
        const d=bl.userData.def; if(!d||d.link!==link) return;
        const dx=Math.round((bl.position.x-gx)/step), dz=Math.round((bl.position.z-gz)/step);
        if(dx===0&&dz===-1) mask|=1;
        if(dx===1&&dz===0) mask|=2;
        if(dx===0&&dz===1) mask|=4;
        if(dx===-1&&dz===0) mask|=8;
    });
    return mask;
}
function wallYawFromMask(mask, fallbackYaw){
    // Prefer continuous run orientation
    if((mask&2)&&(mask&8)) return Math.PI/2; // E-W
    if((mask&1)&&(mask&4)) return 0;         // N-S
    if(mask&2||mask&8) return Math.PI/2;
    if(mask&1||mask&4) return 0;
    return fallbackYaw||0;
}
function wallIsCorner(mask){
    // Exactly one N/S and one E/W neighbor → corner
    const ns=((mask&1)?1:0)+((mask&4)?1:0);
    const ew=((mask&2)?1:0)+((mask&8)?1:0);
    return ns===1 && ew===1;
}
function clearWallGhosts(){
    wallGhosts.forEach(g=>{ scene.remove(g); });
    wallGhosts=[];
}

function createFloorTexture(){
    const size=512, canvas=document.createElement('canvas');
    canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#101015'; ctx.fillRect(0,0,size,size);
    const per=8, ss=size/per;
    for(let i=0;i<per;i++)for(let j=0;j<per;j++){
        const x=i*ss,y=j*ss,val=10+Math.random()*12;
        ctx.fillStyle=`rgb(${val},${val},${val+2})`; ctx.fillRect(x+2,y+2,ss-4,ss-4);
        ctx.strokeStyle='#050505'; ctx.lineWidth=2; ctx.strokeRect(x+2,y+2,ss-4,ss-4);
        ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.beginPath();
        ctx.moveTo(x+Math.random()*ss,y+Math.random()*ss);
        for(let k=0;k<4;k++) ctx.lineTo(x+Math.random()*ss,y+Math.random()*ss); ctx.stroke();
    }
    for(let i=0;i<80;i++){ const x=Math.random()*size,y=Math.random()*size;
        ctx.fillStyle=`rgba(80,10,10,${Math.random()*0.1})`;
        ctx.beginPath(); ctx.arc(x,y,2+Math.random()*6,0,Math.PI*2); ctx.fill(); }
    const t=new THREE.CanvasTexture(canvas);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(60,60);
    return t;
}

// ============================================================================
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function playRoar(vol){
    const ac=ensureAudio(); if(!ac) return; const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
    o.type='sawtooth'; o.frequency.setValueAtTime(68,t); o.frequency.exponentialRampToValueAtTime(38,t+0.6);
    f.type='lowpass'; f.frequency.setValueAtTime(520,t); f.frequency.exponentialRampToValueAtTime(170,t+0.7);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.03,vol||0.2),t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.95);
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.0);
}

function updateEnemy(m,dt){
    const ud=m.userData, type=ud.type;
    const d2=distSqTo(m);
    if(d2>ENEMY_SIM_RADIUS*ENEMY_SIM_RADIUS){ if(ud.mixer) ud.mixer.update(dt*0.35); return; }
    const fs=frameScale(dt), toP=_toPlayer.copy(player.position).sub(m.position).setY(0);
    let dist=toP.length();
    const dir=toP.normalize();
    let speed=ud.speed*fs;

    if(type==='RUNNER'){
        const wob=Math.sin(clock.elapsedTime*8+m.id)*0.5;
        const side=new THREE.Vector3(-dir.z,0,dir.x);
        m.position.x+=(dir.x+side.x*wob)*speed; m.position.z+=(dir.z+side.z*wob)*speed;
    } else if(type==='SPITTER'){
        if(dist<10){ const side=new THREE.Vector3(-dir.z,0,dir.x);
            m.position.x+=side.x*speed*0.5; m.position.z+=side.z*speed*0.5; }
        else { m.position.x+=dir.x*speed*0.6; m.position.z+=dir.z*speed*0.6; }
        ud.attackCooldown-=dt;
        if(ud.attackCooldown<=0 && dist<25){ ud.attackCooldown=2.0;
            const spit=new THREE.Mesh(SPHERE_GEO,new THREE.MeshBasicMaterial({color:0x44ff66}));
            spit.scale.set(0.15,0.15,0.15); spit.position.copy(m.position).add(new THREE.Vector3(0,1.5,0));
            const sd=player.position.clone().sub(m.position).setY(0).normalize(); sd.y=0.1;
            spit.userData={ vel:sd.multiplyScalar(0.4), life:40, isSpit:true, damage:ud.damage };
            projectiles.push(spit); scene.add(spit); }
    } else if(type==='BOSS'){
        ud.attackCooldown-=dt;
        if(ud.attackCooldown<=0 && dist<22){ ud.attackCooldown=3.0;
            ud.chargeVel=dir.clone().multiplyScalar(0.3); ud.chargeTime=30;
            spawnParticles(m.position.clone().add(new THREE.Vector3(0,1,0)),0xff2244,5,0.2,0.1,10); }
        if(ud.chargeTime>0){ ud.chargeTime-=fs; m.position.x+=ud.chargeVel.x*fs; m.position.z+=ud.chargeVel.z*fs; }
        else { m.position.x+=dir.x*speed; m.position.z+=dir.z*speed; }
        ud.attackTimer=(ud.attackTimer||0)+dt;
        if(ud.attackTimer>5){ ud.attackTimer=0;
            for(let i=0;i<3;i++){ const mn=spawnEnemy('GRUNT'); if(mn) mn.position.copy(m.position).add(new THREE.Vector3((Math.random()-0.5)*3,0,(Math.random()-0.5)*3)); } }
    } else if(type==='EXPLODER'){
        m.position.x+=dir.x*speed*1.3; m.position.z+=dir.z*speed*1.3;
    } else { m.position.x+=dir.x*speed; m.position.z+=dir.z*speed; }

    faceTowards(m, player.position.x, player.position.z);
    if(ud.actions) playClip(ud, dist<2.4?['attack','bite','hard','infection']:['walk','walking','run','move']);
    if(ud.roar){ ud.roarTimer-=dt;
        if(ud.roarTimer<=0){ ud.roarTimer=5+Math.random()*5;
            playRoar(0.3*(1-Math.min(1,dist/55)));
            spawnParticles(m.position.clone().add(new THREE.Vector3(0,2.2,0)),0x99bb99,7,0.25,0.18,18);
            if(dist<20) screenShake=Math.max(screenShake,2.5); } }

    // melee on player
    if(dist<1.8){ ud.attackCooldown=(ud.attackCooldown||0)-dt;
        if(ud.attackCooldown<=0){ ud.attackCooldown=0.8; damagePlayer(ud.damage);
            const kb=dir.clone().multiplyScalar(-0.5); player.position.x+=kb.x; player.position.z+=kb.z; } }
}

// ============================================================================
//  Damage
// ============================================================================
function damagePlayer(amount){
    if(sheltered) return;               // safe inside a home
    health=Math.max(0,health-amount);
    document.getElementById('health-text').innerText=`HP: ${health}`;
    screenShake=Math.max(screenShake,amount*0.3);
    const v=document.getElementById('vignette');
    v.style.boxShadow=`inset 0 0 200px 40px rgba(150,0,0,${Math.min(0.55,0.15+amount*0.03)})`;
    setTimeout(()=>{ v.style.boxShadow='inset 0 0 200px 40px rgba(120,0,0,0)'; },250);
    if(health<=0) gameOver();
}
function flashWhite(obj){
    obj.traverse(c=>{ if(c.material && 'emissiveIntensity' in c.material){
        const orig=c.material.emissiveIntensity||0; c.material.emissiveIntensity=orig+2;
        setTimeout(()=>{ if(c.material) c.material.emissiveIntensity=orig; },90); }});
}
function damageEnemy(enemy,amount){
    if(!enemy||!enemy.userData) return false;
    enemy.userData.hp-=amount; flashWhite(enemy);
    if(enemy.userData.isBoss) updateBossBar();
    if(enemy.userData.hp<=0){ killEnemy(enemy); return true; }
    return false;
}
function killEnemy(enemy){
    const pos=enemy.position.clone(), type=enemy.userData.type, isBoss=enemy.userData.isBoss;
    if(type==='EXPLODER'){
        spawnExplosion(pos,0xff4400,3.5);
        if(pos.distanceTo(player.position)<4) damagePlayer(Math.floor(enemy.userData.damage*1.5));
        enemies.forEach(e=>{ if(e!==enemy && e.position.distanceTo(pos)<4) damageEnemy(e,3); });
        screenShake=5;
    } else if(isBoss){
        spawnExplosion(pos,0xff2244,8);
        spawnExplosion(pos.clone().add(new THREE.Vector3(2,0,2)),0xff4488,5);
        spawnExplosion(pos.clone().add(new THREE.Vector3(-2,0,-2)),0xff4488,5);
        screenShake=12; bossActive=false; bossEnemy=null;
        const bw=document.getElementById('boss-wrap'); if(bw) bw.style.display='none';
        for(let i=0;i<8;i++) createPickup(pos.clone().add(new THREE.Vector3((Math.random()-0.5)*5,0,(Math.random()-0.5)*5)),'ammo');
        for(let i=0;i<3;i++) createPickup(pos.clone().add(new THREE.Vector3((Math.random()-0.5)*5,0,(Math.random()-0.5)*5)),'med');
        for(let i=0;i<4;i++) createPickup(pos.clone().add(new THREE.Vector3((Math.random()-0.5)*5,0,(Math.random()-0.5)*5)),'scrap');
    } else {
        spawnParticles(pos,type==='TANK'?0x664422:0x334422,8+Math.random()*8,0.3,0.15,15);
        const r=Math.random();
        if(r>0.78) createPickup(pos,'ammo');
        else if(r>0.62) createPickup(pos,'scrap');
        else if(r>0.5) createPickup(pos,Math.random()>0.5?'wood':'health');
    }
    scene.remove(enemy); enemies=enemies.filter(e=>e!==enemy);
    const pts=enemy.userData.score||1; kills++;
    comboCount++; comboTimer=2.0; if(comboCount>maxCombo) maxCombo=comboCount;
    updateUI(); addKillFeed(`+${pts} ${enemy.userData.name||'Z'}`);
}

function fire(){
    if(buildMode) return;
    const wep=WEAPONS[currentWep], now=clock.getElapsedTime();
    let cooldown=wep.cooldown;
    if(currentWep===7){ minigunSpool=Math.min(minigunSpool+0.02,1); cooldown=wep.cooldown*(1-minigunSpool*0.5); }
    if(now-lastShot<cooldown || ammo<wep.cost) return;
    ammo-=wep.cost; lastShot=now;
    document.getElementById('ammo-count').innerText=`AMMO: ${ammo}`;
    playerModel.userData.muzzleFlash.intensity=25+Math.random()*15;
    if(currentWep===4) screenShake=4; else if(currentWep===5) screenShake=6; else if(currentWep===1) screenShake=2;
    const lookDir=mouseWorld.clone().sub(player.position).setY(0).normalize();
    const gg=playerModel.userData.gunGroup; gg.position.z=-0.1; setTimeout(()=>{gg.position.z=0;},80);
    for(let i=0;i<wep.count;i++){
        const dir=lookDir.clone();
        dir.x+=(Math.random()-0.5)*wep.spread; dir.z+=(Math.random()-0.5)*wep.spread; dir.normalize();
        spawnProjectile(player.position.clone().add(new THREE.Vector3(0,1.2,0)), dir, wep, currentWep);
    }
}
function makeProjMesh(kind, color, scale){
    // Prefer cached Kenney blaster projectile GLBs; fallback to simple mesh
    const key=kind||'bullet';
    if(projMeshCache[key]&&projMeshCache[key]!=='FAIL'&&projMeshCache[key]!=='LOADING'){
        const c=projMeshCache[key].clone(true);
        c.scale.multiplyScalar(scale||1);
        return c;
    }
    if(kind==='grenade'){
        return new THREE.Mesh(new THREE.SphereGeometry(0.18,6,6),
            new THREE.MeshStandardMaterial({color:0x444444,emissive:0xff4400,emissiveIntensity:0.35}));
    }
    const p=new THREE.Mesh(BOX_GEO,new THREE.MeshBasicMaterial({color:color||0xffee88,transparent:true,opacity:0.92,fog:false}));
    p.scale.set(0.12,0.12,0.55);
    return p;
}
function preloadProjectileMeshes(){
    const map={
        bullet:BRAWL_ASSET.bullet_foam,
        tip:BRAWL_ASSET.bullet_tip,
        grenade:BRAWL_ASSET.grenade_a
    };
    Object.keys(map).forEach(k=>{
        if(projMeshCache[k]) return;
        projMeshCache[k]='LOADING';
        loadGLBWithFallback(brawlModelUrls(map[k]), gltf=>{
            const root=gltf.scene;
            prepareMeshMaterials(root,{noFog:true});
            normalizeModel(root,{ height:0.28, centerXZ:true });
            projMeshCache[k]=root;
        }, ()=>{ projMeshCache[k]='FAIL'; });
    });
}
function spawnProjectile(origin, dir, wep, wepIdx){
    if(wep.isGrenade){
        const g=makeProjMesh('grenade',0xff4400,1.2);
        g.position.copy(origin);
        g.userData={ vel:dir.clone().multiplyScalar(wep.speed*1.2), life:60, isGrenade:true, gravity:0.015, bounce:0 };
        projectiles.push(g); scene.add(g); return;
    }
    if(wep.isChain){
        const b=new THREE.Mesh(BOX_GEO,new THREE.MeshBasicMaterial({color:0x00ffff,transparent:true}));
        b.scale.set(0.1,0.1,0.8); b.position.copy(origin);
        b.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);
        b.userData={ vel:dir.clone().multiplyScalar(1.2), life:8, isLightning:true, chainCount:3, hitEnemies:[] };
        projectiles.push(b); scene.add(b); return;
    }
    const kind=(wepIdx===4||wepIdx===3)?'tip':'bullet';
    const p=makeProjMesh(kind, wep.color, wepIdx===4?1.6:1);
    p.position.copy(origin); p.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);
    p.userData={ vel:dir.clone().multiplyScalar(wep.speed), life:wepIdx===4?80:40, damage:wep.damage, color:wep.color, splash:wep.splash };
    projectiles.push(p); scene.add(p);
    if(wepIdx===3||wepIdx===4) spawnParticles(p.position.clone(),wep.color,2,0.1,0.05,5);
}
function updateProjectiles(dt){
    const fs=frameScale(dt);
    for(let i=projectiles.length-1;i>=0;i--){
        const p=projectiles[i]; p.userData.life-=fs;
        if(p.userData.isGrenade){
            p.userData.vel.y-=(p.userData.gravity||0.01)*fs; p.position.x+=p.userData.vel.x*fs; p.position.y+=p.userData.vel.y*fs; p.position.z+=p.userData.vel.z*fs;
            obstacles.forEach(o=>{ const r=o.userData.radius||0.5;
                if(p.position.distanceTo(o.position)<r+0.3){ p.userData.vel.x*=-0.5; p.userData.vel.z*=-0.5;
                    p.userData.vel.y=Math.abs(p.userData.vel.y)*0.3; if(++p.userData.bounce>3) p.userData.life=0; } });
            if(p.position.y<0.2||p.userData.life<=0){
                spawnExplosion(p.position,0xff8800,4); screenShake=8;
                enemies.forEach(e=>{ if(e.position.distanceTo(p.position)<4) damageEnemy(e,3); });
                buildings.forEach(b=>{ if(b.position.distanceTo(p.position)<4) damageBuilding(b,2); });
                if(p.position.distanceTo(player.position)<3.5) damagePlayer(10);
                scene.remove(p); projectiles.splice(i,1); continue;
            }
            if(Math.random()>0.5) spawnParticles(p.position.clone(),0xff8800,1,0.05,0.05,5);
            continue;
        }
        if(p.userData.isSpit){
            p.position.x+=p.userData.vel.x*fs; p.position.y+=p.userData.vel.y*fs; p.position.z+=p.userData.vel.z*fs;
            if(p.position.distanceTo(player.position)<1.2){ damagePlayer(p.userData.damage);
                spawnParticles(p.position,0x44ff66,5,0.2,0.1,10); scene.remove(p); projectiles.splice(i,1); continue; }
            if(p.userData.life<=0){ scene.remove(p); projectiles.splice(i,1); } continue;
        }
        if(p.userData.isLightning){
            p.position.x+=p.userData.vel.x*fs; p.position.y+=p.userData.vel.y*fs; p.position.z+=p.userData.vel.z*fs;
            for(let j=enemies.length-1;j>=0;j--){ const en=enemies[j];
                if(p.position.distanceTo(en.position.clone().add(new THREE.Vector3(0,1,0)))<1.3){
                    if(!p.userData.hitEnemies.includes(en)){ p.userData.hitEnemies.push(en); damageEnemy(en,2);
                        spawnParticles(en.position.clone().add(new THREE.Vector3(0,1,0)),0x00ffff,8,0.3,0.1,8);
                        if(p.userData.hitEnemies.length<=p.userData.chainCount){ let nr=null,nd=999;
                            enemies.forEach(e2=>{ if(!p.userData.hitEnemies.includes(e2)){ const d=e2.position.distanceTo(en.position);
                                if(d<nd&&d<6){ nd=d; nr=e2; } } });
                            if(nr){ const cd=nr.position.clone().sub(en.position).setY(0).normalize();
                                p.position.copy(en.position).add(new THREE.Vector3(0,1,0)); p.userData.vel=cd.multiplyScalar(1.2); } } }
                    break; } }
            if(p.userData.life<=0||p.userData.hitEnemies.length>p.userData.chainCount){ scene.remove(p); projectiles.splice(i,1); }
            continue;
        }
        p.position.x+=p.userData.vel.x*fs; p.position.y+=p.userData.vel.y*fs; p.position.z+=p.userData.vel.z*fs;
        if(particles.length<MAX_PARTICLES*0.6 && Math.random()>0.82) spawnParticles(p.position.clone(),p.userData.color||0xffffff,1,0.05,0.03,4);
        let hitObs=false;
        obstacles.forEach(o=>{ if(p.position.distanceTo(o.position)<(o.userData.radius||0.3)+0.2){ hitObs=true;
            spawnParticles(p.position,0x888888,3,0.1,0.05,5); } });
        if(hitObs){ scene.remove(p); projectiles.splice(i,1); continue; }
        let hit=false;
        for(let j=enemies.length-1;j>=0;j--){ const en=enemies[j];
            if(p.position.distanceTo(en.position.clone().add(new THREE.Vector3(0,1,0)))<1.2){ hit=true;
                if(p.userData.splash){ spawnExplosion(p.position,0xff8800,p.userData.splash);
                    enemies.forEach(e=>{ if(e.position.distanceTo(p.position)<p.userData.splash) damageEnemy(e,p.userData.damage); }); }
                else damageEnemy(en,p.userData.damage||1);
                spawnParticles(p.position,p.userData.color||0xffffff,5,0.2,0.08,8); break; } }
        if(hit){ scene.remove(p); projectiles.splice(i,1); continue; }
        if(p.userData.life<=0){ scene.remove(p); projectiles.splice(i,1); }
    }
}

// ============================================================================
//  MELEE — RMB / F: slash toward cursor at melee range
// ============================================================================
const MELEE_RANGE=3.4, MELEE_REACH=2.5, MELEE_CONE=0.4, MELEE_LUNGE=0.5;
let meleeCd=0;
const _meleeAim=new THREE.Vector3(), _meleeStrike=new THREE.Vector3();

function refreshAimFromPointer(e){
    if(!e||!camera||!floor) return;
    const t=e.touches?e.touches[0]:e;
    mouse.x=(t.clientX/window.innerWidth)*2-1;
    mouse.y=-(t.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObject(floor);
    if(hits.length>0) mouseWorld.copy(hits[0].point);
}
function getMeleeAimDir(out){
    out=out||_meleeAim;
    out.copy(mouseWorld).sub(player.position).setY(0);
    if(out.lengthSq()<0.05){
        out.set(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
    }
    return out.normalize();
}
function meleeStrikePoint(aimDir,out){
    out=out||_meleeStrike;
    return out.copy(player.position).add(aimDir.clone().multiplyScalar(MELEE_REACH)).setY(0.65);
}
function spawnMeleeSlash(origin,aimDir){
    const slash=new THREE.Group();
    slash.position.copy(origin).setY(0.55);
    slash.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),aimDir);
    const arc=new THREE.Mesh(new THREE.RingGeometry(0.35,1.65,14,1,-0.95,1.9),
        new THREE.MeshBasicMaterial({color:0x00ffcc,transparent:true,opacity:0.82,side:THREE.DoubleSide,depthWrite:false}));
    arc.rotation.x=-Math.PI/2;
    slash.add(arc);
    const streak=new THREE.Mesh(new THREE.PlaneGeometry(0.12,2.0),
        new THREE.MeshBasicMaterial({color:0xccffee,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false}));
    streak.position.set(0,0.08,1.05); streak.rotation.x=-Math.PI/2;
    slash.add(streak);
    slash.userData={
        life:11, maxLife:11, melee:true, meleeSlash:true,
        origin:origin.clone(), aimDir:aimDir.clone(), reach:MELEE_REACH, swing:-1.05, sparked:false
    };
    explosions.push(slash); scene.add(slash);
}
function meleeHitsInCone(aimDir,dmg){
    for(let j=enemies.length-1;j>=0;j--){
        const en=enemies[j];
        const to=en.position.clone().sub(player.position).setY(0);
        const d=to.length();
        if(d>MELEE_RANGE) continue;
        to.normalize();
        if(to.dot(aimDir)<MELEE_CONE) continue;
        damageEnemy(en,dmg);
        en.position.x+=aimDir.x*1.35; en.position.z+=aimDir.z*1.35;
        spawnParticles(en.position.clone().add(new THREE.Vector3(0,1,0)),0x00ffcc,5,0.28,0.1,9);
    }
    for(let i=resourceNodes.length-1;i>=0;i--){
        const nN=resourceNodes[i];
        const to=nN.position.clone().sub(player.position).setY(0);
        const d=to.length();
        if(d>MELEE_RANGE) continue;
        to.normalize();
        if(to.dot(aimDir)<0.22) continue;
        mineNode(nN); break;
    }
}
function doMelee(evt){
    if(meleeCd>0||buildMode||playerVehicle||sheltered) return;
    if(evt) refreshAimFromPointer(evt);
    meleeCd=0.42;
    const aimDir=getMeleeAimDir();
    const yaw=Math.atan2(aimDir.x,aimDir.z);
    player.rotation.y=yaw+(player.userData.faceYaw||0);
    const origin=player.position.clone();
    player.position.x+=aimDir.x*MELEE_LUNGE;
    player.position.z+=aimDir.z*MELEE_LUNGE;
    spawnMeleeSlash(origin,aimDir);
    meleeHitsInCone(aimDir,3);
    if(player.userData.actions) playClip(player.userData,['attack','punch','slash','melee','hit']);
    if(playerModel&&playerModel.userData.muzzleFlash) playerModel.userData.muzzleFlash.intensity=10;
    screenShake=Math.max(screenShake,2.2);
    const strike=meleeStrikePoint(aimDir);
    spawnParticles(strike,0x66ffdd,6,0.22,0.12,10);
}

// ============================================================================
//  Pickups
// ============================================================================
function createPickup(pos,type){
    const g=new THREE.Group(); g.position.copy(pos).setY(0.5);
    const cmap={ammo:0xffcc00,health:0x44ff66,scrap:0xbbbbcc,wood:0xcc9955,med:0xff6699,water:0x33bbff,food:0x88dd44};
    const color=cmap[type]||0xffffff;
    const mesh=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1}));
    mesh.scale.setScalar(0.3); g.add(mesh);
    const light=new THREE.PointLight(color,3,5); g.add(light);
    g.userData={ type, bob:Math.random()*10, rot:0 };
    pickups.push(g); scene.add(g);
}
function updatePickups(){
    for(let i=pickups.length-1;i>=0;i--){ const p=pickups[i];
        p.userData.rot+=0.03; p.rotation.y=p.userData.rot;
        const dist=player.position.distanceTo(p.position);
        if(dist<MAGNET_RADIUS){ p.position.lerp(player.position.clone().setY(0.5),0.08);
            p.scale.setScalar(0.8+Math.sin(clock.elapsedTime*10)*0.2); }
        else { p.position.y=0.5+Math.sin(clock.elapsedTime*5+p.userData.bob)*0.2; p.scale.setScalar(1); }
        if(dist<1.2){
            const t=p.userData.type;
            if(t==='ammo'){ ammo+=20; addKillFeed('+20 AMMO'); }
            else if(t==='health'){ health=Math.min(maxHealth,health+20); addKillFeed('+20 HP'); }
            else if(t==='scrap'){ res.scrap+=3; addKillFeed('+3 ⚙'); }
            else if(t==='wood'){ res.wood+=4; addKillFeed('+4 🪵'); }
            else if(t==='med'){ res.med+=1; addKillFeed('+1 ✚'); }
            else if(t==='water'){ res.water+=3; addKillFeed('+3 💧'); }
            else if(t==='food'){ res.food+=3; addKillFeed('+3 🌾'); }
            updateUI(); scene.remove(p); pickups.splice(i,1);
        }
    }
}

// ============================================================================
//  Particles / explosions update
// ============================================================================
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
        p.position.add(p.userData.vel); p.userData.vel.multiplyScalar(0.93); p.userData.vel.y-=0.01;
        p.userData.life--; const lr=p.userData.life/p.userData.maxLife;
        p.material.opacity=lr; p.scale.setScalar(lr);
        if(p.userData.life<=0){ scene.remove(p); particles.splice(i,1); } }
    for(let i=explosions.length-1;i>=0;i--){ const e=explosions[i];
        e.userData.life--; const r=e.userData.life/e.userData.maxLife;
        if(e.userData.meleeSlash){
            const t=1-r, ud=e.userData;
            e.position.copy(ud.origin).setY(0.55).add(ud.aimDir.clone().multiplyScalar(ud.reach*t));
            e.scale.setScalar(0.85+t*0.55);
            if(e.children[0]) e.children[0].rotation.z=ud.swing+t*2.1;
            e.traverse(c=>{ if(c.material&&'opacity' in c.material) c.material.opacity=(1-t)*0.82; });
            if(t>0.72&&!ud.sparked){
                ud.sparked=true;
                const hitPt=ud.origin.clone().add(ud.aimDir.clone().multiplyScalar(ud.reach)).setY(0.7);
                spawnParticles(hitPt,0x00ffcc,4,0.18,0.1,8);
            }
        } else if(e.userData.melee){ e.material.opacity=r*0.7; }
        else { e.scale.setScalar(1+(1-r)*e.userData.radius); e.material.opacity=r; }
        if(e.userData.life<=0){ scene.remove(e); explosions.splice(i,1); } }
}

function buildBuildBar(){
    const bar=document.getElementById('build-bar'); bar.innerHTML='';
    BUILDABLES.forEach((b,idx)=>{
        const el=document.createElement('div'); el.className='kpx-slot kpx-pixel'+(idx===buildSel?' active':'');
        const costStr=Object.entries(b.cost).map(([k,v])=>`${v}${k[0]}`).join(' ');
        el.className='kpx-slot cpx-slot cpx-slot--action cpx-pixel'+(idx===buildSel?' active':'');
        el.innerHTML=`<div class="kpx-cost cpx-cost">${costStr}</div><div class="kpx-label cpx-label">${b.name}</div>`;
        el.setAttribute('data-tip-title', b.name);
        el.setAttribute('data-tip-body', buildTipBody(b));
        el.onpointerdown=(e)=>{ e.preventDefault(); buildSel=idx; refreshGhost(); buildBuildBar(); };
        bar.appendChild(el);
    });
    if(typeof CraftpixRpgUI!=='undefined') CraftpixRpgUI.refreshTooltips();
    else if(typeof KenneyPixelUI!=='undefined') KenneyPixelUI.refreshTooltips();
}
function toggleBuildMode(){
    buildMode=!buildMode;
    const equip=document.getElementById('equipment-bar');
    const build=document.getElementById('build-bar');
    const wLabel=document.getElementById('weapon-label');
    const bLabel=document.getElementById('build-label');

    if(build) build.style.display=buildMode?'flex':'none';
    if(wLabel) wLabel.style.display=buildMode?'none':'block';
    if(bLabel) bLabel.style.display=buildMode?'block':'none';
    document.getElementById('build-actions').style.display=buildMode?'flex':'none';
    const bb=document.getElementById('build-btn');
    if(bb){ bb.classList.toggle('kpx-btn--cyan', buildMode); bb.classList.toggle('kpx-btn--brown', !buildMode); }
    if(buildMode){ buildBuildBar(); refreshGhost(); }
    else {
        if(ghost){ scene.remove(ghost); ghost=null; }
        wallDrag=null; clearWallGhosts();
    }
}
function styleGhost(obj){
    if(!obj||typeof obj.traverse!=='function') return obj||new THREE.Group();
    obj.traverse(c=>{ if(c.material){ const m=c.material.clone(); m.transparent=true; m.opacity=0.45;
        m.emissive=new THREE.Color(0x00ffcc); m.emissiveIntensity=0.25; c.material=m; } });
    return obj;
}
function refreshGhost(){
    if(ghost){ scene.remove(ghost); ghost=null; }
    clearWallGhosts();
    const b=BUILDABLES[buildSel];
    if(!b) return;
    const show=(obj)=>{ if(!buildMode||!obj) return; if(ghost) scene.remove(ghost); ghost=styleGhost(obj); scene.add(ghost); };
    if(!b.glb){ show(styleGhost(fallbackBuild(b))); return; }
    loadGLB(b.glb, scaleOptsFor(b), show, ()=>fallbackBuild(b));
}
function rotateGhost(){ ghostRot+=Math.PI/2; }
function canAfford(b){ return Object.entries(b.cost).every(([k,v])=>res[k]>=v); }
function canAffordN(b,n){
    return Object.entries(b.cost).every(([k,v])=>res[k]>=v*n);
}
function payFor(b){ Object.entries(b.cost).forEach(([k,v])=>{ res[k]-=v; }); updateUI(); }
function payForN(b,n){ Object.entries(b.cost).forEach(([k,v])=>{ res[k]-=v*n; }); updateUI(); }

function updateGhost(){
    const b=BUILDABLES[buildSel];
    if(!b) return;
    const gx=snapToFoot(mouseWorld.x, b.foot), gz=snapToFoot(mouseWorld.z, b.foot);

    // Drag wall run preview
    if(wallDrag&&wallDrag.active&&b.drag){
        clearWallGhosts();
        const cells=wallRunCells(wallDrag.startX, wallDrag.startZ, gx, gz, b.foot);
        wallDrag.cells=cells;
        let affordable=canAffordN(b, cells.length);
        cells.forEach((cell,i)=>{
            const ok=affordable && !buildingOverlap(cell.x, cell.z, b.foot);
            // lightweight preview boxes (cheap during drag)
            const m=new THREE.Mesh(BOX_GEO, new THREE.MeshBasicMaterial({
                color:ok?0x00ffcc:0xff3333, transparent:true, opacity:0.35, depthWrite:false
            }));
            m.scale.set(b.foot*0.95, 2.2, 0.45);
            m.position.set(cell.x, 1.1, cell.z);
            m.rotation.y=cell.yaw;
            scene.add(m); wallGhosts.push(m);
        });
        if(ghost) ghost.visible=false;
        return;
    }

    if(!ghost) return;
    ghost.visible=true;
    let yaw=ghostRot;
    if(b.link){
        const mask=wallNeighborMask(gx,gz,b.foot,b.link);
        yaw=wallYawFromMask(mask, ghostRot);
    }
    ghost.position.set(gx,0,gz); ghost.rotation.y=yaw;
    const ok=canAfford(b) && !buildingOverlap(gx, gz, b.foot);
    const col=ok?0x00ffcc:0xff3333;
    ghost.traverse(c=>{ if(c.material&&c.material.emissive) c.material.emissive.setHex(col); });
    ghost.userData.placeOK=ok;
    ghost.userData.placeYaw=yaw;
}

function placeBuildingAt(b, gx, gz, rot, quiet){
    if(!canAfford(b)) return false;
    if(buildingOverlap(gx, gz, b.foot)) return false;
    payFor(b);
    // link: pick corner mesh when L-junction
    let glbPath=b.glb, yaw=rot;
    if(b.link){
        const mask=wallNeighborMask(gx,gz,b.foot,b.link);
        yaw=wallYawFromMask(mask, rot);
        if(b.cornerGlb && wallIsCorner(mask)) glbPath=b.cornerGlb;
    }
    if(!quiet) spawnExplosion(new THREE.Vector3(gx,0.5,gz),0x00ffcc,1.2);
    const place=(obj)=>{
        if(!obj) return;
        obj.position.set(gx,0,gz); obj.rotation.y=yaw;
        obj.userData=Object.assign({}, obj.userData, {
            isBuilding:true, def:b, hp:b.hp, maxHp:b.hp, radius:b.foot*0.5,
            turretCd:0, growth:0, link:b.link||null
        });
        if(b.fire){
            const l=new THREE.PointLight(0xff7722,10,18); l.position.y=1.6; obj.add(l); obj.userData.fireLight=l;
            const glow=new THREE.PointLight(0xffaa44,3,10); glow.position.y=0.4; obj.add(glow);
        }
        if(b.vision){ const l=new THREE.PointLight(0xfff0dd,5,32); l.position.y=Math.max(4, (b.height||6)*0.75); obj.add(l); }
        if(b.camp){ const l=new THREE.PointLight(0xffcc88,2.5,14); l.position.y=2.2; obj.add(l); }
        buildings.push(obj); scene.add(obj);
        if(b.blocks){ obj.userData.radius=b.foot*0.48; obstacles.push(obj); }
        if(b.farm){
            obj.userData.growth=0; crops.push(obj);
            // Crop growth group (GLB farm plot has no sprout node)
            if(!obj.userData.sprout){
                const sprout=new THREE.Group(); sprout.position.y=0.35; obj.add(sprout); obj.userData.sprout=sprout;
            }
        }
        if(b.fire && !obj.userData.flame){
            // If campfire loaded from GLB without flame, add emissive core
            const core=new THREE.Mesh(SPHERE_GEO,new THREE.MeshBasicMaterial({color:0xffaa33}));
            core.scale.set(0.35,0.55,0.35); core.position.y=0.9; obj.add(core); obj.userData.flame=core;
        }
        if(b.link) relinkWallNeighbors(gx,gz,b.foot,b.link);
    };
    if(!glbPath){ place(fallbackBuild(b)); if(!quiet) addKillFeed(`built ${b.name}`); return true; }
    loadGLB(glbPath, scaleOptsFor(b), place, ()=>fallbackBuild(b));
    if(!quiet) addKillFeed(`built ${b.name}`);
    return true;
}

function relinkWallNeighbors(gx,gz,foot,link){
    // Soft pass: adjust yaw of orthogonal neighbors for continuous fence look
    const step=foot||GRID;
    buildings.forEach(bl=>{
        const d=bl.userData.def; if(!d||d.link!==link) return;
        const dx=Math.round((bl.position.x-gx)/step), dz=Math.round((bl.position.z-gz)/step);
        if(Math.abs(dx)+Math.abs(dz)!==1) return;
        const mask=wallNeighborMask(bl.position.x, bl.position.z, step, link);
        bl.rotation.y=wallYawFromMask(mask, bl.rotation.y);
    });
}

function placeBuilding(){
    const b=BUILDABLES[buildSel];
    if(!b) return;
    // Multi-cell wall drag commit
    if(wallDrag&&wallDrag.cells&&wallDrag.cells.length){
        const cells=wallDrag.cells;
        let placed=0;
        for(const cell of cells){
            if(!canAfford(b)) break;
            if(buildingOverlap(cell.x, cell.z, b.foot)) continue;
            if(placeBuildingAt(b, cell.x, cell.z, cell.yaw, true)) placed++;
        }
        if(placed){ addKillFeed(`${b.name} run ×${placed}`); spawnExplosion(new THREE.Vector3(cells[0].x,0.5,cells[0].z),0x00ffcc,2); }
        wallDrag=null; clearWallGhosts();
        if(ghost) ghost.visible=true;
        return;
    }
    if(!ghost||!ghost.userData.placeOK) return;
    const gx=ghost.position.x, gz=ghost.position.z;
    const rot=ghost.userData.placeYaw!=null?ghost.userData.placeYaw:ghostRot;
    placeBuildingAt(b, gx, gz, rot);
}

function beginWallDrag(){
    const b=BUILDABLES[buildSel];
    if(!b||!b.drag||!buildMode) return false;
    const gx=snapToFoot(mouseWorld.x, b.foot), gz=snapToFoot(mouseWorld.z, b.foot);
    wallDrag={ active:true, startX:gx, startZ:gz, endX:gx, endZ:gz, cells:[{x:gx,z:gz,yaw:ghostRot}] };
    return true;
}
function endWallDrag(){
    if(!wallDrag||!wallDrag.active){ wallDrag=null; return; }
    wallDrag.active=false;
    placeBuilding();
    wallDrag=null; clearWallGhosts();
}
function damageBuilding(b,amount){
    if(!b.userData) return;
    b.userData.hp-=amount; flashWhite(b);
    if(b.userData.hp<=0){ destroyBuilding(b); }
}
function destroyBuilding(b){
    spawnExplosion(b.position.clone().setY(0.6),0x885533,2.5);
    scene.remove(b);
    buildings=buildings.filter(x=>x!==b);
    obstacles=obstacles.filter(x=>x!==b);
    crops=crops.filter(x=>x!==b);
    addKillFeed(`${b.userData.def?b.userData.def.name:'structure'} destroyed`);
}

// procedural fallback meshes per buildable (SI-ish relative to foot/height)
function fallbackBuild(b){
    const g=new THREE.Group();
    const foot=b.foot||3, h=b.height||2.4;
    const mat=new THREE.MeshStandardMaterial({color:b.fbColor||0x666666,roughness:0.9});
    if(b.fbShape==='wall'){
        const m=new THREE.Mesh(BOX_GEO,mat); m.scale.set(foot*0.98,h,0.45); m.position.y=h*0.5; m.castShadow=true; g.add(m);
        for(let i=-1;i<=1;i+=2){ const post=new THREE.Mesh(BOX_GEO,mat); post.scale.set(0.35,h*1.1,0.5); post.position.set(i*foot*0.48,h*0.55,0); g.add(post); }
    } else if(b.fbShape==='tower'){
        const base=new THREE.Mesh(BOX_GEO,mat); base.scale.set(foot*0.85,h*0.85,foot*0.85); base.position.y=h*0.42; base.castShadow=true; g.add(base);
        const top=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x333333})); top.scale.set(foot*1.05,h*0.08,foot*1.05); top.position.y=h*0.88; g.add(top);
        if(b.turret){ const barrel=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x222222,metalness:0.7}));
            barrel.scale.set(0.35,0.35,1.5); barrel.position.set(0,h*0.92,0.7); g.add(barrel); g.userData.barrel=barrel; }
    } else if(b.fbShape==='fire'){
        // Real campfire: ring of logs + stacked wood + emissive flame core + sparks holder
        const logMat=new THREE.MeshStandardMaterial({color:0x3a2415,roughness:1});
        for(let i=0;i<5;i++){
            const log=new THREE.Mesh(BOX_GEO,logMat);
            const a=(i/5)*Math.PI*2;
            log.scale.set(1.15,0.22,0.28);
            log.position.set(Math.cos(a)*0.55,0.18,Math.sin(a)*0.55);
            log.rotation.y=a; log.rotation.z=0.15; g.add(log);
        }
        const pit=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.85,0.2,10), new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:1}));
        pit.position.y=0.08; g.add(pit);
        const core=new THREE.Mesh(SPHERE_GEO,new THREE.MeshBasicMaterial({color:0xffaa33}));
        core.scale.set(0.35,0.55,0.35); core.position.y=0.75; g.add(core); g.userData.flame=core;
        const outer=new THREE.Mesh(SPHERE_GEO,new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:0.55}));
        outer.scale.set(0.55,0.9,0.55); outer.position.y=0.85; g.add(outer); g.userData.flameOuter=outer;
        const ash=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x1a1a1a})); ash.scale.set(1.2,0.08,1.2); ash.position.y=0.04; g.add(ash);
    } else if(b.fbShape==='flat'){
        // Farm plot: soil bed + crop rows (not a city building)
        const dirt=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x4a3322,roughness:1})); dirt.scale.set(foot,0.22,foot); dirt.position.y=0.11; dirt.receiveShadow=true; g.add(dirt);
        const soil=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x3d5c28,roughness:1})); soil.scale.set(foot*0.9,0.08,foot*0.9); soil.position.y=0.24; g.add(soil);
        // fence posts around plot
        for(let i=-1;i<=1;i+=2) for(let j=-1;j<=1;j+=2){
            const post=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x6b5535})); post.scale.set(0.15,0.9,0.15); post.position.set(i*foot*0.48,0.55,j*foot*0.48); g.add(post);
        }
        const sprout=new THREE.Group(); sprout.position.y=0.28; g.add(sprout); g.userData.sprout=sprout;
        for(let row=0;row<3;row++) for(let col=0;col<4;col++){
            const blade=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x6db33f}));
            blade.scale.set(0.1,0.35+Math.random()*0.25,0.1);
            blade.position.set((col-1.5)*0.7,0.25,(row-1)*0.85);
            sprout.add(blade);
        }
    } else { // box / barricade / storage
        const m=new THREE.Mesh(BOX_GEO,mat); m.scale.set(foot,Math.min(h,1.6),foot*0.7); m.position.y=Math.min(h,1.6)*0.5; m.castShadow=true; g.add(m);
    }
    return g;
}

function updateBuildings(dt){
    for(let i=buildings.length-1;i>=0;i--){ const b=buildings[i], def=b.userData.def;
        // fire flicker
        if(b.userData.fireLight){ b.userData.fireLight.intensity=7+Math.sin(clock.elapsedTime*12)*3;
            if(b.userData.flame){
                const pulse=0.9+Math.sin(clock.elapsedTime*15)*0.25;
                b.userData.flame.scale.set(0.35*pulse,0.55*pulse,0.35*pulse);
            }
            if(b.userData.flameOuter){
                const p2=0.95+Math.sin(clock.elapsedTime*11+1)*0.2;
                b.userData.flameOuter.scale.set(0.55*p2,0.9*p2,0.55*p2);
                if(b.userData.flameOuter.material) b.userData.flameOuter.material.opacity=0.4+Math.sin(clock.elapsedTime*9)*0.15;
            }
            // occasional ember particles
            if(Math.random()<0.08) spawnParticles(b.position.clone().setY(1.2),0xff6622,2,0.12,0.06,10);
        }
        // campfire heals nearby player+allies
        if(def&&def.fire){
            if(player.position.distanceTo(b.position)<7 && health<maxHealth){ health=Math.min(maxHealth,health+10*dt); }
            allies.forEach(a=>{ if(a.position.distanceTo(b.position)<7 && a.userData.hp<a.userData.maxHp) a.userData.hp+=12*dt; });
        }
        // turret AI
        if(def.turret){ b.userData.turretCd-=dt;
            if(b.userData.turretCd<=0){
                let nr=null,nd=def.turret.range;
                enemies.forEach(e=>{ const d=e.position.distanceTo(b.position); if(d<nd){ nd=d; nr=e; } });
                if(nr){ b.userData.turretCd=def.turret.cd;
                    const muzzleY=Math.max(2.2, (def.height||4)*0.72);
                    const origin=b.position.clone().add(new THREE.Vector3(0,muzzleY,0));
                    const dir=nr.position.clone().add(new THREE.Vector3(0,1,0)).sub(origin).normalize();
                    if(b.userData.barrel){ b.rotation.y=Math.atan2(dir.x,dir.z); }
                    spawnProjectile(origin,dir,{color:def.turret.color,speed:def.turret.speed,damage:def.turret.dmg,splash:def.turret.splash},-1);
                    spawnParticles(origin.clone().add(dir.clone().multiplyScalar(1.5)),def.turret.color,4,0.2,0.1,6);
                } }
        }
        // farm growth (faster by day, boosted by farmers + nearby mills)
        if(def&&def.farm){
            let rate=(isNight?0.2:1.0)*0.04;
            const farmers=allies.filter(a=>a.userData.job==='FARM').length;
            rate*=(1+farmers*0.5);
            const mills=buildings.filter(x=>x.userData.def&&x.userData.def.farmBoost&&x.position.distanceTo(b.position)<22).length;
            rate*=(1+mills*0.35);
            b.userData.growth+=rate*dt;
            if(b.userData.sprout){ const s=Math.min(1,b.userData.growth);
                b.userData.sprout.scale.setScalar(0.2+s*1.0);
                if(b.userData.sprout.children.length===0){ for(let k=0;k<5;k++){ const blade=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x88dd44}));
                    blade.scale.set(0.12,0.8,0.12); blade.position.set((Math.random()-0.5)*1.4,0.4,(Math.random()-0.5)*1.4); b.userData.sprout.add(blade); } } }
            if(b.userData.growth>=1){ b.userData.growth=0; res.food+=4; res.water=Math.max(0,res.water-1);
                if(b.userData.sprout){ while(b.userData.sprout.children.length) b.userData.sprout.remove(b.userData.sprout.children[0]); }
                spawnParticles(b.position.clone().setY(0.6),0x88dd44,8,0.2,0.12,12); addKillFeed('+4 🌾 harvest'); updateUI(); }
        }
    }
}

// zombies chew on buildings they collide with (handled in resolveCollisions)

//  CIVILIANS + ALLIES

function makeHumanoid(colorTorso, colorHead){
    const g=new THREE.Group();
    const torso=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:colorTorso,roughness:0.7}));
    torso.scale.set(0.7,1.0,0.45); torso.position.y=1.2; torso.castShadow=true; g.add(torso);
    const head=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:colorHead||0xffcc99}));
    head.scale.set(0.45,0.45,0.45); head.position.y=1.95; g.add(head);
    return g;
}
function spawnCivilian(){
    if(civilians.length>=4) return;
    const c=makeHumanoid(0x9988aa,0xeebb99);
    const angle=Math.random()*Math.PI*2, dist=20+Math.random()*45;
    c.position.set(player.position.x+Math.cos(angle)*dist,0,player.position.z+Math.sin(angle)*dist);
    c.userData={ isCivilian:true, wander:Math.random()*Math.PI*2, panic:0 };
    attachAnimator(c,{glb:CHAR_DEFS.civilian.glb,height:2.0,kenneyTex:CHAR_DEFS.civilian.tex,defaultClip:['walk','idle']});
    // distress marker (added after animator so it isn't hidden as a placeholder)
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.08,6,16),new THREE.MeshBasicMaterial({color:0xffff66,fog:false}));
    ring.rotation.x=Math.PI/2; ring.position.y=2.8; c.add(ring); c.userData.ring=ring;
    const beam=new THREE.PointLight(0xffff66,3,8); beam.position.y=2.5; c.add(beam);
    civilians.push(c); scene.add(c);
}
function updateCivilians(dt){
    for(let i=civilians.length-1;i>=0;i--){ const c=civilians[i];
        if(c.userData.ring){ c.userData.ring.rotation.z+=2*dt; c.userData.ring.position.y=2.8+Math.sin(clock.elapsedTime*3)*0.15; }
        // flee from nearest zombie
        let threat=null,td=12;
        enemies.forEach(e=>{ const d=e.position.distanceTo(c.position); if(d<td){ td=d; threat=e; } });
        if(threat){ const away=c.position.clone().sub(threat.position).setY(0).normalize();
            c.position.x+=away.x*0.05; c.position.z+=away.z*0.05; faceTowards(c, c.position.x+away.x, c.position.z+away.z); }
        else { c.userData.wander+=(Math.random()-0.5)*0.1;
            c.position.x+=Math.cos(c.userData.wander)*0.012; c.position.z+=Math.sin(c.userData.wander)*0.012;
            faceTowards(c, c.position.x+Math.cos(c.userData.wander), c.position.z+Math.sin(c.userData.wander)); }
        // killed by zombie touching
        if(threat&&td<1.3){ scene.remove(c); civilians.splice(i,1); addKillFeed('a survivor was lost…'); continue; }
    }
}
function recruitCivilian(c){
    if(allies.length>=MAX_SQUAD){ addKillFeed('squad full (5)'); return; }
    scene.remove(c); civilians=civilians.filter(x=>x!==c);
    const names=['Vance','Mara','Ortega','Kaddress','Juno','Pike','Sable','Rho','Cobb','Wren'];
    const a=makeHumanoid(0x335577,0xeebb99);
    a.position.copy(c.position);
    a.userData={ isAlly:true, hp:60, maxHp:60, name:names[Math.floor(Math.random()*names.length)],
        job:'GUARD', attackCd:0, jobTimer:0, wander:0 };
    attachAnimator(a,{glb:CHAR_DEFS.ally.glb,height:2.0,kenneyTex:CHAR_DEFS.ally.tex,defaultClip:['idle','walk']});
    // little rifle (added after animator so it stays visible)
    const gun=new THREE.Mesh(BOX_GEO,new THREE.MeshStandardMaterial({color:0x222,metalness:0.6}));
    gun.scale.set(0.12,0.12,0.7); gun.position.set(0.4,1.1,0.4); a.add(gun);
    allies.push(a); scene.add(a);
    spawnParticles(a.position.clone().add(new THREE.Vector3(0,1.5,0)),0x44ff66,10,0.3,0.12,14);
    addKillFeed(`${a.userData.name} joined!`); renderSquad();
}
function updateAllies(dt){
    for(let i=allies.length-1;i>=0;i--){ const a=allies[i], ud=a.userData;
        if(ud.hp<=0){ scene.remove(a); allies.splice(i,1); addKillFeed(`${ud.name} fell`); renderSquad(); continue; }
        // combat happens at night OR if enemies are close any time, OR job=GUARD
        let nearest=null,nd=26;
        enemies.forEach(e=>{ const d=e.position.distanceTo(a.position); if(d<nd){ nd=d; nearest=e; } });
        const combat = nearest && (isNight || ud.job==='GUARD' || nd<14);

        if(combat){
            // move to a good firing distance
            const to=nearest.position.clone().sub(a.position).setY(0); const d=to.length(); to.normalize();
            faceTowards(a, nearest.position.x, nearest.position.z);
            if(a.userData.actions) playClip(a.userData,['walk','run','idle']);
            if(d>11){ a.position.x+=to.x*0.07; a.position.z+=to.z*0.07; }
            else if(d<6){ a.position.x-=to.x*0.05; a.position.z-=to.z*0.05; }
            ud.attackCd-=dt;
            if(ud.attackCd<=0){ ud.attackCd=0.6+Math.random()*0.3;
                const origin=a.position.clone().add(new THREE.Vector3(0,1.2,0));
                spawnProjectile(origin,to.clone(),{color:0x66ccff,speed:1.0,damage:1},-1);
                const f=new THREE.PointLight(0x66ccff,8,6); f.position.set(0.4,1.1,0.8); a.add(f); setTimeout(()=>a.remove(f),60);
            }
            // leash to player/campfire so they don't run off
            const anchor=getRallyPoint();
            if(a.position.distanceTo(anchor)>30){ const back=anchor.clone().sub(a.position).setY(0).normalize();
                a.position.x+=back.x*0.06; a.position.z+=back.z*0.06; }
        } else {
            // DAY JOBS
            doAllyJob(a,dt);
        }
    }
}
function getRallyPoint(){
    // nearest campfire, else player
    let cf=null,cd=999;
    buildings.forEach(b=>{ if(b.userData.def&&b.userData.def.rally){ const d=player.position.distanceTo(b.position); if(d<cd){ cd=d; cf=b; } } });
    return cf?cf.position.clone():player.position.clone();
}
function doAllyJob(a,dt){
    const ud=a.userData;
    if(ud.job==='GUARD'){ // idle near rally
        const anchor=getRallyPoint(); const to=anchor.clone().sub(a.position).setY(0);
        if(to.length()>4){ to.normalize(); a.position.x+=to.x*0.04; a.position.z+=to.z*0.04; faceTowards(a,anchor.x,anchor.z); }
        return;
    }
    if(ud.job==='FARM'){ // walk to nearest farm
        let f=null,fd=999; crops.forEach(c=>{ const d=c.position.distanceTo(a.position); if(d<fd){ fd=d; f=c; } });
        if(f){ const to=f.position.clone().sub(a.position).setY(0);
            if(to.length()>2){ to.normalize(); a.position.x+=to.x*0.045; a.position.z+=to.z*0.045; faceTowards(a,f.position.x,f.position.z); }
        } else { doAllyJob.idle(a); }
        return; // growth boost handled in updateBuildings
    }
    // WATER / MEDIC / SALVAGE: forage timer producing resources
    ud.jobTimer+=dt;
    // wander outward a bit to look "busy"
    ud.wander+=(Math.random()-0.5)*0.08;
    a.position.x+=Math.cos(ud.wander)*0.03; a.position.z+=Math.sin(ud.wander)*0.03;

    if(ud.jobTimer>=period){ ud.jobTimer=0;
        if(ud.job==='WATER'){ res.water+=3; addKillFeed(`${ud.name}: +3 💧`); }
        else if(ud.job==='MEDIC'){ res.med+=1; addKillFeed(`${ud.name}: +1 ✚`); }
        else if(ud.job==='SALVAGE'){ res.scrap+=4; if(Math.random()<0.3){ tryUnlockGun(); } addKillFeed(`${ud.name}: +4 ⚙`); }
        updateUI();
    }
}
